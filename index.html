  const d = j.data || {};
  const insta = /instagram\.com/.test(url);
  const cap = insta ? ((d.description||'').match(/:\s*["“](.*)["”]\s*$/s)?.[1] || (d.title||'').match(/["“](.*)["”]/s)?.[1] || '') : '';
  return {title: insta ? '' : (d.title||'').split(/\s[|·–]\s/)[0].trim(), image: d.image?.url || d.logo?.url || '',
    desc: insta ? '' : (d.description||'').slice(0,240), caption: cap, insta,
    source: insta ? 'Instagram' + (d.author ? ' · ' + d.author.replace(/^@?/, '@') : '') : (d.publisher || host(url))};
}
function guessTags(text){
  const t = keyOf(text);
  const g = {vegan: /vegan/.test(t), veggie: /vegan|vegetar|veggie/.test(t), seasons: [], course: ''};
  if (/kürbis|kuerbis|maronen|pilz|steinpilz|apfelkuchen|zwetschg|pflaume/.test(t)) g.seasons.push('herbst');
  if (/spargel|bärlauch|baerlauch|rhabarber|erdbeer/.test(t)) g.seasons.push('fruehling');
  if (/grill|gazpacho|wassermelone|sommer|eis\b|tomatensalat|zucchini/.test(t)) g.seasons.push('sommer');
  if (/lebkuchen|plätzchen|plaetzchen|glühwein|gluehwein|weihnacht|rotkohl|grünkohl|gruenkohl|eintopf|gulasch/.test(t)) g.seasons.push('winter');
  if (/suppe|eintopf/.test(t)) g.course = 'suppe'; else if (/salat/.test(t)) g.course = 'salat';
  else if (/kuchen|torte|brot\b|muffin|brownie|plätzchen|cookie/.test(t)) g.course = 'backen';
  else if (/dessert|pudding|mousse|tiramisu|eis\b/.test(t)) g.course = 'dessert';
  else if (/porridge|müsli|granola|pancake|frühstück|overnight/.test(t)) g.course = 'fruehstueck';
  else if (/lasagne|pasta|curry|pizza|burger|bowl|risotto|auflauf|gnocchi|chili|bolognese/.test(t)) g.course = 'haupt';
  return g;
}
function editRecipe(id, preset = {}){
  const r = id ? recipeById(id) : null;
  const v = r ? JSON.parse(JSON.stringify(r)) : {url:'', title:'', image:'', desc:'', source:'', vegan:false, veggie:false, kids:false, seasons:[], course:'', time:0, note:'', ingredients:[], steps:'', servings:0, ...preset};
  openSheet(`<h2>${r ? 'Rezept bearbeiten' : 'Rezept hinzufügen'}</h2>
    <div class="field"><label>Link zum Rezept</label>
      <div class="row"><input id="rUrl" type="url" inputmode="url" placeholder="https://…" value="${esc(v.url)}" style="flex:1">
      <button type="button" class="btn" id="rPaste" title="Aus Zwischenablage einfügen">📋</button></div>
      <span class="muted" id="rStatus"></span></div>
    <div class="photoBox" id="rImgBox"></div>
    <div class="field"><label>Überschrift</label><input id="rTitle" value="${esc(v.title)}" placeholder="z. B. Vegane Lasagne"></div>
    <div class="field"><label>Eigenschaften</label><div class="chips txt" id="rFlags">
      <button type="button" data-k="vegan" class="${v.vegan?'on':''}">🌱 Vegan</button><button type="button" data-k="veggie" class="${v.veggie?'on':''}">🥕 Vegetarisch</button>
      <button type="button" data-k="kids" class="${v.kids?'on':''}">🧒 Kinder mögen’s</button></div></div>
    <div class="field"><label>Jahreszeit (keine = ganzjährig)</label><div class="chips txt" id="rSeas">${SEASONS.map(s=>`<button type="button" data-k="${s.id}" class="${v.seasons.includes(s.id)?'on':''}">${s.icon} ${s.name}</button>`).join('')}</div></div>
    <div class="row"><div class="field"><label>Gang</label><select id="rCourse"><option value="">–</option>${COURSES.map(c=>`<option value="${c.id}" ${v.course===c.id?'selected':''}>${c.name}</option>`).join('')}</select></div>
      <div class="field"><label>Zeit (Minuten)</label><input id="rTime" type="number" inputmode="numeric" min="0" step="5" value="${v.time||''}" placeholder="z. B. 45"></div></div>
    <div class="field"><label>Zutaten – eine pro Zeile <span style="font-weight:500">(für Instagram: ganze Caption hier einfügen)</span></label>
      <textarea id="rIng" rows="5" placeholder="200 g Spaghetti&#10;1 Dose Tomaten&#10;…">${esc(v.ingredients.join('\n'))}</textarea>
      <div class="row"><button type="button" class="btn grow small" id="rCapPaste">📋 Caption einfügen</button><button type="button" class="btn grow small" id="rCapParse">✨ Zutaten erkennen</button></div></div>
    <div class="row"><div class="field"><label>Portionen</label><input id="rServ" type="number" inputmode="numeric" min="0" value="${v.servings||''}" placeholder="z. B. 4"></div><div class="field"></div></div>
    <details style="margin-bottom:14px" ${v.steps ? '' : ''}><summary class="muted" style="cursor:pointer">Zubereitung (optional)</summary>
      <div class="field" style="margin-top:10px"><textarea id="rSteps" rows="5">${esc(v.steps)}</textarea></div></details>
    <div class="field"><label>Notiz (optional)</label><textarea id="rNote" rows="2" placeholder="z. B. doppelte Menge Soße">${esc(v.note)}</textarea></div>
    <details style="margin-bottom:14px"><summary class="muted" style="cursor:pointer">Bild & Beschreibung anpassen</summary>
      <div class="field" style="margin-top:10px"><label>Bild-Adresse</label><input id="rImg" value="${esc(v.image.startsWith('data:')?'(eigenes Foto)':v.image)}" placeholder="https://…jpg"></div>
      <div class="row" style="margin-bottom:14px"><button type="button" class="btn grow" id="rPick">📷 Eigenes Foto</button></div><input type="file" id="rFile" accept="image/*" hidden>
      <div class="field"><label>Kurzbeschreibung</label><textarea id="rDesc" rows="2">${esc(v.desc)}</textarea></div></details>
    <div class="row"><button class="btn grow" onclick="closeSheet()">Abbrechen</button><button class="btn primary grow" id="rOk">Speichern</button></div>`,
  () => {
    let img = v.image;
    const showImg = () => { $('#rImgBox').innerHTML = img ? `<img src="${esc(img)}" alt="" referrerpolicy="no-referrer" onerror="this.remove()">` : ''; };
    showImg();
    const flags = sel => $(sel).onclick = e => { const b = e.target.closest('button'); if (b) { b.classList.toggle('on');
      if (b.dataset.k === 'vegan' && b.classList.contains('on')) $('#rFlags [data-k=veggie]').classList.add('on'); } };
    flags('#rFlags'); flags('#rSeas');
    let lastFetched = r ? v.url : '';
    const load = async () => {
      const url = $('#rUrl').value.trim(); if (!/^https?:\/\//.test(url) || url === lastFetched) return; lastFetched = url;
      const dup = data.recipes.find(x => x.url === url && x.id !== id); if (dup) $('#rStatus').textContent = '⚠️ Dieses Rezept ist schon im Rezeptbuch: ' + dup.title;
      else $('#rStatus').textContent = '⏳ Lade Vorschau …';
      try {
        const p = await fetchPreview(url);
        if (p.caption && !$('#rIng').value.trim()) { $('#rIng').value = p.caption; applyParse(true); }
        if (!$('#rTitle').value.trim() || !r) $('#rTitle').value = p.title || $('#rTitle').value;
        if (p.image && (!img || !r)) { img = p.image; $('#rImg').value = img; showImg(); }
        if (!$('#rDesc').value.trim()) $('#rDesc').value = p.desc; v.source = p.source;
        const g = guessTags(url + ' ' + p.title + ' ' + p.desc);
        if (!r) { if (g.vegan) $('#rFlags [data-k=vegan]').classList.add('on'); if (g.veggie) $('#rFlags [data-k=veggie]').classList.add('on');
          g.seasons.forEach(s => $(`#rSeas [data-k=${s}]`).classList.add('on')); if (g.course && !$('#rCourse').value) $('#rCourse').value = g.course; }
        if (!dup) $('#rStatus').textContent = p.insta ? (p.caption ? '✓ Instagram-Beitrag – Zutaten aus der Caption erkannt, bitte prüfen' : 'Instagram-Beitrag: Caption kopieren und unten bei „Zutaten“ einfügen') : '✓ Vorschau geladen – bitte kurz prüfen';
      } catch(e) {
        if (!$('#rTitle').value.trim()) { const g = new URL(url).pathname.split('/').filter(Boolean).pop() || ''; $('#rTitle').value = decodeURIComponent(g).replace(/[-_]+/g,' ').replace(/\.\w+$/,'').replace(/^\w/, c=>c.toUpperCase()); }
        const g = guessTags(url); if (!r && g.vegan) { $('#rFlags [data-k=vegan]').classList.add('on'); $('#rFlags [data-k=veggie]').classList.add('on'); }
        if (/instagram\.com/.test(url)) { v.source = 'Instagram'; $('#rTitle').value = r ? $('#rTitle').value : ''; }
        if (!dup) $('#rStatus').textContent = /instagram\.com/.test(url) ? 'Instagram-Beitrag: Caption kopieren und unten bei „Zutaten“ einfügen – Überschrift wird daraus vorgeschlagen.' : 'Keine automatische Vorschau – Überschrift bitte selbst eintragen, Bild optional.';
      }
    };
    const applyParse = quiet => {
      const raw = $('#rIng').value; if (!raw.trim()) { if (!quiet) toast('Erst die Caption einfügen'); return; }
      const c = parseCaption(raw);
      if (!c.ingredients.length) { if (!quiet) toast('Keine Zutaten erkannt – bitte eine Zutat pro Zeile eintragen', 3500); return; }
      $('#rIng').value = c.ingredients.join('\n');
      if (c.steps && !$('#rSteps').value.trim()) { $('#rSteps').value = c.steps; $('#rSteps').closest('details').open = true; }
      if (c.servings && !$('#rServ').value) $('#rServ').value = c.servings;
      if (c.title && !$('#rTitle').value.trim()) $('#rTitle').value = c.title;
      const g = guessTags(raw);
      if (!r) { if (g.vegan) $('#rFlags [data-k=vegan]').classList.add('on'); if (g.veggie) $('#rFlags [data-k=veggie]').classList.add('on');
        g.seasons.forEach(s => $(`#rSeas [data-k=${s}]`).classList.add('on')); if (g.course && !$('#rCourse').value) $('#rCourse').value = g.course; }
      if (!quiet) toast(c.ingredients.length + ' Zutaten erkannt – bitte kurz prüfen');
    };
    $('#rCapParse').onclick = () => applyParse(false);
    $('#rIng').onpaste = () => setTimeout(() => { const t = $('#rIng').value; if (t.split('\n').length > 3 && /zutaten|ingredients|#|\p{Extended_Pictographic}/iu.test(t)) applyParse(false); }, 50);
    $('#rCapPaste').onclick = async () => { try { const t = await navigator.clipboard.readText(); if (!t.trim()) return toast('Zwischenablage ist leer');
      const u = (t.match(/https?:\/\/\S+/)||[])[0]; if (u && t.trim() === u) { $('#rUrl').value = u; return load(); }
      $('#rIng').value = t; applyParse(false); } catch(e) { $('#rIng').focus(); toast('Bitte lange ins Feld tippen → Einsetzen', 3500); } };
    $('#rUrl').onchange = load; $('#rUrl').onpaste = () => setTimeout(load, 50);
    $('#rUrl').onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); load(); } };
    $('#rPaste').onclick = async () => { try { const t = await navigator.clipboard.readText(); const u = (t.match(/https?:\/\/\S+/)||[])[0];
      if (u) { $('#rUrl').value = u; load(); } else toast('Kein Link in der Zwischenablage'); } catch(e) { toast('Einfügen nicht erlaubt – bitte lange tippen → Einsetzen'); } };
    $('#rImg').onchange = () => { const x = $('#rImg').value.trim(); if (x !== '(eigenes Foto)') { img = x; showImg(); } };
    $('#rPick').onclick = () => $('#rFile').click();
    $('#rFile').onchange = async e => { const f = e.target.files[0]; if (!f) return; try { img = await shrinkPhoto(f, 900, .75); $('#rImg').value = '(eigenes Foto)'; showImg(); } catch(err) { toast(err.message); } };
    $('#rOk').onclick = () => {
      const url = $('#rUrl').value.trim(), title = $('#rTitle').value.trim();
      if (!title && !url) { $('#rUrl').focus(); return toast('Bitte Link oder Überschrift angeben'); }
      const vals = { url, title: title || host(url) || 'Rezept', image: img || '', desc: $('#rDesc').value.trim(), source: v.source || host(url),
        vegan: $('#rFlags [data-k=vegan]').classList.contains('on'), veggie: $('#rFlags [data-k=veggie]').classList.contains('on') || $('#rFlags [data-k=vegan]').classList.contains('on'),
        kids: $('#rFlags [data-k=kids]').classList.contains('on'), seasons: $$('#rSeas .on').map(b=>b.dataset.k),
        course: $('#rCourse').value, time: +$('#rTime').value || 0, note: $('#rNote').value.trim(),
        ingredients: $('#rIng').value.split('\n').map(x=>x.trim()).filter(Boolean), steps: $('#rSteps').value.trim(), servings: +$('#rServ').value || 0 };
      if (vals.ingredients.length > 25 && !confirm(vals.ingredients.length + ' Zeilen als Zutaten speichern? (Tipp: „✨ Zutaten erkennen“ filtert die Caption)')) return;
      let target = r;
      if (!target) { target = {id: slug(vals.title).slice(0,30) + '-' + uid().slice(0,4), ratings:{}, cooked:0, lastCooked:null, added:now()}; data.recipes.push(target); }
      Object.assign(target, vals); touch(target);
      if (!save()) return;
      if (/cdninstagram|fbcdn/.test(vals.image)) keepImage(target);
      closeSheet(); if (!location.hash.startsWith('#/rezepte')) location.hash = '#/rezepte'; else viewRecipes();
      toast(r ? 'Gespeichert' : 'Rezept hinzugefügt');
    };
    if (preset.url) load(); else if (!r) $('#rUrl').focus();
  });
}

/* Instagram-Bildlinks laufen nach einigen Tagen ab → wenn möglich als eigenes Foto sichern */
async function keepImage(r){
  try { const res = await fetch(r.image); if (!res.ok) throw 0; r.image = await shrinkPhoto(await res.blob(), 900, .75); touch(r); save(); if (location.hash.startsWith('#/rezepte')) viewRecipes(); }
  catch(e) { toast('Tipp: Instagram-Bilder verschwinden nach ein paar Tagen – unter „Bild“ einen Screenshot als eigenes Foto hinterlegen', 5000); }
}

/* ---------- Einstellungen ---------- */
function viewSettings(){
  $('#topbar').innerHTML = `<button class="iconbtn" aria-label="Zurück" onclick="location.hash=''">←</button><div class="htitle">Einstellungen</div><div class="spacer"></div>${syncBtn()}`;
  const c = ghCfg();
  $('#main').innerHTML = `
    <div class="sec" style="margin-top:6px">☁️ Abgleich Handy ↔ PC (GitHub)</div>
    ${ghReady() ? `<div class="banner" style="${sync.state==='err'?'background:var(--coral-soft)':''}">${sync.state==='err'?'⚠️':sync.state==='busy'?'⏳':'✅'}
        <span style="flex:1">${esc(sync.msg || 'Eingerichtet')}${local.gh.last ? ' · zuletzt ' + new Date(local.gh.last).toLocaleString('de-DE',{dateStyle:'short',timeStyle:'short'}) : ''}</span>
        <button class="btn small" onclick="syncNow(true)">Jetzt synchronisieren</button></div>` :
      `<p class="muted" style="margin-top:0">Damit Änderungen von Handy und PC (und von Anika) automatisch zusammenfinden und Bring immer den aktuellen Stand bekommt, schreibt bring+ direkt in dein GitHub-Repository. Einmal pro Gerät einrichten:</p>
      <ol class="steps muted">
        <li>Am PC auf <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">github.com → Fine-grained token</a> gehen.</li>
        <li>Name z. B. <code>bring+</code>, Ablauf z. B. 1 Jahr.</li>
        <li><b>Repository access:</b> „Only select repositories“ → <code>${esc(c.repo)}</code>.</li>
        <li><b>Permissions → Repository → Contents:</b> „Read and write“.</li>
        <li>„Generate token“ → Token kopieren und hier einfügen.</li>
      </ol>`}
    <div class="field"><label for="ghTok">Token</label><input id="ghTok" type="password" autocomplete="off" placeholder="github_pat_…" value="${esc(local.gh.token||'')}"></div>
    <div class="row">
      <div class="field"><label for="ghOwner">Konto</label><input id="ghOwner" value="${esc(c.owner)}"></div>
      <div class="field"><label for="ghRepo">Repository</label><input id="ghRepo" value="${esc(c.repo)}"></div>
    </div>
    <div class="menu"><label><input type="checkbox" id="ghAuto" ${local.gh.auto!==false?'checked':''}><span class="grow">Automatisch synchronisieren<small>nach jeder Änderung und beim Öffnen der App</small></span></label></div>
    <div class="row" style="margin-bottom:6px"><button class="btn primary grow" id="ghSave">Speichern & testen</button>${ghReady()?'<button class="btn danger" id="ghOff">Trennen</button>':''}</div>
    <p class="muted">Das Token bleibt nur auf diesem Gerät. Für Anikas Handy einfach dasselbe Token dort eintragen.</p>

    <div class="sec">⭐ Rezepte</div>
    <div class="field"><label for="meName">Dein Name (für Bewertungen auf diesem Gerät)</label><input id="meName" value="${esc(me())}" placeholder="z. B. Philipp"></div>

    <div class="sec">Kategorien</div>
    <div class="menu" id="catList">${data.categories.map((c,i) => `<div class="catrow">
      <input class="ic" value="${esc(c.icon)}" aria-label="Symbol" onchange="setCat(${jsq(c.id)},'icon',this.value)">
      <input value="${esc(c.name)}" aria-label="Kategoriename" onchange="setCat(${jsq(c.id)},'name',this.value)">
      <button class="iconbtn" aria-label="Nach oben" onclick="moveCat(${i},-1)" ${i===0?'disabled style="opacity:.3"':''}>↑</button>
      <button class="iconbtn" aria-label="Löschen" onclick="delCat(${jsq(c.id)})">🗑</button></div>`).join('')}</div>
    <button class="btn" onclick="addCat()">＋ Kategorie</button>

    <div class="sec">Daten sichern / übertragen</div>
    <div class="menu">
      <button onclick="exportJson()">⬇️ <span class="grow">Sicherung exportieren<small>daten.json mit allen Listen und Rezepten</small></span></button>
      <button onclick="$('#fileIn').click()">⬆️ <span class="grow">Sicherung importieren<small>zusammenführen oder ersetzen</small></span></button>
      <button onclick="exportPackage()">📦 <span class="grow">Veröffentlichungs-Paket (ohne Sync)<small>Zip zum manuellen Hochladen auf GitHub</small></span></button>
    </div>
    <p class="muted">Bring lädt die Listen von <code>${esc(hostedBase())}listen/…</code></p>
    <div class="menu"><button class="danger" onclick="resetAll()">↺ <span class="grow">Dieses Gerät zurücksetzen<small>lokale Daten verwerfen und Stand vom Server neu laden</small></span></button></div>`;
  $('#fabslot').innerHTML = ''; $('#selslot').innerHTML = '';
  $('#meName').onchange = e => { local.me = e.target.value.trim(); saveLocal(); toast('Gemerkt'); };
  $('#ghAuto').onchange = e => { local.gh.auto = e.target.checked; saveLocal(); };
  $('#ghSave').onclick = async () => {
    local.gh.token = $('#ghTok').value.trim(); local.gh.owner = $('#ghOwner').value.trim(); local.gh.repo = $('#ghRepo').value.trim(); saveLocal(); setSync('idle');
    if (!local.gh.token) return toast('Bitte Token einfügen');
    $('#ghSave').textContent = '⏳ Teste …';
    try { const r = await gh(''); if (!r) throw Object.assign(new Error('nicht gefunden'), {status:404});
      if (r.permissions && !r.permissions.push) throw Object.assign(new Error('keine Schreibrechte'), {status:403});
      toast('Verbunden ✓ – synchronisiere …'); await syncNow(true); }
    catch(e) { setSync('err', e.status === 401 ? 'Token ungültig' : e.status === 404 ? 'Repository nicht gefunden – Konto/Name prüfen' : e.status === 403 ? 'Token hat keine Schreibrechte' : e.message); toast(sync.msg, 4000); }
    viewSettings();
  };
  if ($('#ghOff')) $('#ghOff').onclick = () => { if (!confirm('Sync auf diesem Gerät trennen? (Token wird hier gelöscht)')) return; local.gh = {}; saveLocal(); setSync('off'); viewSettings(); };
}
function setCat(id, k, v){ const c = catById(id); if (c && v.trim()) { c[k] = v.trim(); touch(c); save(); } }
function moveCat(i, d){ const a = data.categories, j = i + d; if (j<0||j>=a.length) return; [a[i],a[j]]=[a[j],a[i]]; data.catOrderU = now(); save(); viewSettings(); }
function addCat(){
  const name = prompt('Name der neuen Kategorie:'); if (!name || !name.trim()) return;
  data.categories.push({id: slug(name)+'-'+uid().slice(0,3), name: name.trim(), icon: ICONS[data.categories.length % ICONS.length], u: now()});
  data.catOrderU = now(); save(); viewSettings();
}
function delCat(id){
  const c = catById(id), n = data.lists.reduce((s,l)=>s+l.items.filter(i=>i.cat===id).length, 0);
  if (!confirm(`Kategorie „${c.name}“ löschen?` + (n ? `\n${n} Artikel landen dann unter „Ohne Kategorie“.` : ''))) return;
  data.categories = data.categories.filter(x=>x!==c); tomb('cat', id); save(); viewSettings();
}
async function resetAll(){
  if (!confirm('Lokale Daten auf diesem Gerät verwerfen und den Stand vom Server neu laden?\n\nNoch nicht synchronisierte Änderungen gehen verloren.')) return;
  let fresh = null;
  try { if (ghReady()) { const g = await ghGet('daten.json'); fresh = g?.text && JSON.parse(g.text); }
        else if (/^https/.test(location.protocol)) { const r = await fetch('daten.json?ts='+now(), {cache:'no-store'}); if (r.ok) fresh = await r.json(); } } catch(e) {}
  data = normalize(fresh || JSON.parse(JSON.stringify(SEED))); save({noSync:true}); location.hash = ''; route(); toast(fresh ? 'Stand vom Server geladen' : 'Grundbefüllung geladen');
}

/* ---------- Teilen-Ziel (Android: „Teilen → bring+“) ---------- */
function handleShareTarget(){
  const p = new URLSearchParams(location.search);
  const txt = [p.get('url'), p.get('text'), p.get('title')].filter(Boolean).join(' ');
  const url = (txt.match(/https?:\/\/\S+/)||[])[0];
  if (!url) return;
  history.replaceState(null, '', location.pathname + '#/rezepte');
  route(); editRecipe(null, {url});
}

/* ---------- Start ---------- */
if (firstRun) save({noSync:true});
if (migrate() | migrateCheese()) save();
route();
handleShareTarget();
if (ghReady()) syncNow(); else pullFromPages();
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { if (ghReady()) syncNow(); else pullFromPages(); } });
window.addEventListener('resize', () => { clearTimeout(window._rs); window._rs = setTimeout(() => { if (!sheetOpen()) route(); }, 250); });
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
