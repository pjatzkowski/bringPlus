<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>bring+</title>
<meta name="theme-color" content="#1a8a63">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="bring+">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
:root{
  --bg:#f5f2ea; --card:#ffffff; --ink:#1c2924; --muted:#6b7a73; --line:#e6e0d3;
  --accent:#1a8a63; --accent-ink:#ffffff; --accent-soft:#e1f2ea; --coral:#ff7a59; --coral-soft:#ffe9e2;
  --danger:#c8452f; --star:#f2a100; --side:#ece7db;
  --shadow:0 1px 2px rgba(28,41,36,.06),0 6px 18px rgba(28,41,36,.06);
  --r:16px; --tab:64px;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#121a17; --card:#1b2622; --ink:#e9efe9; --muted:#93a39b; --line:#2a3833;
    --accent:#34b886; --accent-ink:#0d1a15; --accent-soft:#1f3a2f; --coral:#ff8a6b; --coral-soft:#3a2620;
    --danger:#ff7a63; --star:#ffbf3c; --side:#17211d;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
  }
}
[hidden]{display:none!important}
/* ---------- Druckansicht ---------- */
.printdoc{background:#fff;color:#1a1a1a;border-radius:14px;box-shadow:var(--shadow);padding:28px 30px;max-width:820px;margin:6px auto 30px;font:15px/1.5 Georgia,"Iowan Old Style","Times New Roman",serif}
.printdoc h1{font:700 28px/1.2 -apple-system,"Segoe UI",Roboto,Arial,sans-serif;margin:0 0 6px;letter-spacing:-.01em}
.printdoc .pmeta{font:13px/1.5 -apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:#555;margin:0 0 14px;display:flex;flex-wrap:wrap;gap:4px 14px}
.printdoc .pimg{width:100%;max-height:300px;object-fit:cover;border-radius:10px;display:block;margin:0 0 16px}
.printdoc .pcols{display:grid;grid-template-columns:minmax(200px,1fr) 2fr;gap:28px}
@media (max-width:640px){.printdoc{padding:18px}.printdoc .pcols{grid-template-columns:1fr;gap:10px}}
.printdoc h2{font:700 13px/1 -apple-system,"Segoe UI",Roboto,Arial,sans-serif;text-transform:uppercase;letter-spacing:.08em;color:#1a8a63;margin:4px 0 10px;border-bottom:2px solid #1a8a63;padding-bottom:6px}
.printdoc ul.ping{list-style:none;padding:0;margin:0}
.printdoc ul.ping li{padding:4px 0 4px 22px;border-bottom:1px dotted #ccc;position:relative;break-inside:avoid}
.printdoc ul.ping li::before{content:"☐";position:absolute;left:0;top:3px;color:#888}
.printdoc ul.ping li.sub{padding-left:0;border:0;font-weight:700;margin-top:8px}
.printdoc ul.ping li.sub::before{content:""}
.printdoc ol.psteps{padding-left:22px;margin:0}
.printdoc ol.psteps li{margin:0 0 9px;padding-left:4px;break-inside:avoid}
.printdoc .psub{font-weight:700;margin:12px 0 6px;break-after:avoid}
.printdoc .psub:first-child{margin-top:0}
.printdoc .pnote{margin-top:16px;padding:10px 12px;border-left:3px solid #1a8a63;background:#f4f8f6;font-size:14px}
.printdoc .pfoot{margin-top:20px;padding-top:8px;border-top:1px solid #ddd;font:11px/1.4 -apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:#777;word-break:break-all}
.printdoc .pmissing{font:14px/1.5 -apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:#7a5a00;background:#fff6dc;border-radius:8px;padding:10px 12px}
.printopts{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:4px 0 10px;font-size:14px;color:var(--muted)}
.printopts label{display:flex;gap:6px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 12px;cursor:pointer}
.printdoc.noimg .pimg{display:none}
.printdoc.big{font-size:17px}
@media print{
  @page{margin:14mm 14mm 16mm}
  body{padding:0!important;background:#fff!important}
  header.top,aside.side,nav.tabs,#fabslot,#selslot,.toast,.scrim,.sheet,.noprint{display:none!important}
  main.wrap{max-width:none;padding:0}
  .printdoc{box-shadow:none;border-radius:0;padding:0;margin:0;max-width:none}
  .printdoc .pimg{max-height:75mm}
  .printdoc a{color:inherit;text-decoration:none}
  .printdoc h2{break-after:avoid}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;min-height:100vh;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) calc(env(safe-area-inset-bottom) + var(--tab) + 90px) env(safe-area-inset-left)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}

/* ---------- Kopf ---------- */
header.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
header.top .wrap{display:flex;align-items:center;gap:6px;height:60px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:22px;letter-spacing:-.02em;white-space:nowrap}
.brand img{width:34px;height:34px;border-radius:9px}
.brand b{color:var(--coral)}
.htitle{font-weight:750;font-size:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spacer{flex:1}
.iconbtn{width:42px;height:42px;border-radius:12px;border:0;background:transparent;display:grid;place-items:center;font-size:20px;flex:none;position:relative}
.iconbtn:hover{background:var(--line)}
.iconbtn .badge{position:absolute;right:6px;top:6px;width:9px;height:9px;border-radius:50%;background:var(--muted)}
.iconbtn .badge.ok{background:var(--accent)} .iconbtn .badge.err{background:var(--danger)} .iconbtn .badge.busy{background:var(--star);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.3}}
.title-edit{font-weight:750;font-size:20px;border:0;background:transparent;padding:6px 4px;min-width:0;flex:1;border-radius:8px}
.title-edit:focus{outline:2px solid var(--accent);background:var(--card)}

/* ---------- Unterer Tab-Balken (Handy) ---------- */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:8;display:flex;background:var(--card);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);height:calc(var(--tab) + env(safe-area-inset-bottom))}
nav.tabs button{flex:1;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;color:var(--muted);font-weight:600}
nav.tabs button span{font-size:22px;line-height:1}
nav.tabs button.on{color:var(--accent)}

/* ---------- Seitenleiste (PC) ---------- */
aside.side{display:none}
@media (min-width: 960px){
  body{padding:0 0 40px 280px;--tab:0px}
  nav.tabs{display:none}
  aside.side{display:flex;flex-direction:column;position:fixed;left:0;top:0;bottom:0;width:280px;background:var(--side);border-right:1px solid var(--line);padding:16px 12px;overflow:auto;z-index:9}
  aside.side .brand{padding:4px 8px 14px}
  .wrap{max-width:980px;padding:0 28px}
  header.top .wrap{height:68px}
}
.sgroup{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:16px 10px 6px;font-weight:700}
.slink{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;padding:8px 10px;border-radius:10px;text-align:left;font-weight:600}
.slink:hover{background:color-mix(in srgb,var(--line) 70%,transparent)}
.slink.on{background:var(--card);box-shadow:var(--shadow)}
.slink .e{width:24px;text-align:center;font-size:18px}
.slink .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slink .k{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:0 5px;font-weight:600}
.slink .c{font-size:12px;color:var(--muted);font-weight:500}
.slink.drop{outline:2px dashed var(--accent);background:var(--accent-soft)}
.sfoot{margin-top:auto;padding-top:14px;font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:4px;padding-left:10px}

/* ---------- Startseite ---------- */
.hint{color:var(--muted);font-size:14px;margin:6px 2px 14px}
.lists{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.lcard{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;text-align:left;border:0;display:flex;flex-direction:column;gap:6px;min-height:118px}
.lcard:hover{outline:2px solid var(--accent-soft)}
.lcard .emo{font-size:30px;line-height:1}
.lcard .nm{font-weight:700;font-size:16px}
.lcard .ct{color:var(--muted);font-size:13px}
.lcard.base{background:transparent;box-shadow:none;border:2px solid var(--line)}
.lcard.add{border:2px dashed var(--line);background:transparent;box-shadow:none;align-items:center;justify-content:center;color:var(--muted);font-weight:600}
.sec{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:22px 4px 8px;font-weight:700}

/* ---------- Liste ---------- */
.actions{display:flex;gap:8px;margin:4px 0 12px;flex-wrap:wrap}
.btn{border:0;border-radius:12px;padding:11px 15px;font-weight:650;background:var(--card);box-shadow:var(--shadow);display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.grow{flex:1;justify-content:center}
.btn.danger{color:var(--danger)}
.btn.small{padding:7px 11px;font-size:14px}
.btn:active{transform:scale(.98)}
.btn kbd,.kbd{font:600 11px/1 ui-monospace,Menlo,monospace;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:2px 5px;color:var(--muted);background:var(--bg)}
.btn.primary kbd{background:transparent;color:inherit;border-color:rgba(255,255,255,.4)}
.incl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:0 0 6px;font-size:14px;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 10px;font-size:14px;font-weight:600;color:var(--ink)}
.chip button{border:0;background:transparent;padding:0;color:var(--muted);font-size:14px}
.chip.add{border-style:dashed;color:var(--muted);cursor:pointer}
.cat{margin:16px 0 6px}
.cat h3{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 4px 8px;display:flex;gap:6px;align-items:center}
.items{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.item{display:flex;align-items:center;gap:12px;padding:10px 14px;border-top:1px solid var(--line);position:relative;cursor:pointer;user-select:none}
.item:first-child{border-top:0}
.item:hover{background:color-mix(in srgb,var(--accent-soft) 45%,transparent)}
.item.cur{box-shadow:inset 3px 0 0 var(--accent);background:color-mix(in srgb,var(--accent-soft) 60%,transparent)}
.item.sel{background:var(--accent-soft)}
.item .cb{width:22px;height:22px;border-radius:7px;border:2px solid var(--line);flex:none;display:grid;place-items:center;font-size:14px;color:var(--accent-ink);background:var(--card)}
.item.sel .cb{background:var(--accent);border-color:var(--accent)}
.item .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);flex:none}
.item.inh .dot{background:transparent;border:2px solid var(--muted)}
.item .txt{flex:1;min-width:0}
.item .n{font-weight:600}
.item .s{color:var(--muted);font-size:14px}
.item .from{font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:1px 8px;white-space:nowrap}
.item .thumb{width:44px;height:44px;border-radius:10px;object-fit:cover;flex:none;background:var(--line)}
.item .ia{display:flex;gap:2px;opacity:.0;transition:opacity .1s}
.item:hover .ia,.item.cur .ia{opacity:1}
.item .ia button{border:0;background:transparent;border-radius:8px;width:32px;height:32px;font-size:16px;color:var(--muted)}
.item .ia button:hover{background:var(--line);color:var(--ink)}
@media (hover:none){.item .ia{display:none}}
@media (max-width:959px){body:not(.selmode) .item .cb{display:none}}
@media (hover:none){.btn kbd,.selbar kbd,.btn .kbd{display:none}}
.item .pcb{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center;font-size:15px;color:#fff;background:var(--card)}
.item.packed .pcb{background:var(--accent);border-color:var(--accent)}
.item.packed .n{text-decoration:line-through;color:var(--muted)}
.item.packed .thumb{opacity:.5}
.item.pk .ia{opacity:1}
@media (hover:none){.item.pk .ia{display:flex}.item.pk .ia [data-act=copy],.item.pk .ia [data-act=del]{display:none}}
.item .ccb{width:26px;height:26px;border-radius:50%;border:2px solid var(--accent);flex:none;display:grid;place-items:center;font-size:15px;color:#fff;background:var(--card)}
.item.done .ccb{background:var(--muted);border-color:var(--muted)}
.item.done{opacity:.55}
.item.done .n{text-decoration:line-through}
.item.ck .ia{opacity:1}
@media (hover:none){.item.ck .ia{display:flex}.item.ck .ia [data-act=del]{display:none}}
.gtag{font-size:13px;margin-left:4px}
.guests .grow2{display:flex;flex-direction:column;gap:6px;width:100%}
.guests .grow2 > div{display:flex;align-items:center;justify-content:space-between;gap:10px}
.toolrow{display:flex;gap:8px;margin:0 0 12px;flex-wrap:wrap}
.toolrow .btn{flex:1;justify-content:center;min-width:140px}
.btn.ai{background:linear-gradient(135deg,#7b5cff,#c76bff);color:#fff}
.seasonnav{display:flex;align-items:center;justify-content:space-between;margin:0 0 10px}
.seasonnav b{font-size:17px}
.schips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
.schips button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 12px;font-size:15px}
.schips button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.idea{background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:12px 14px;margin:0 0 10px}
.idea h3{margin:0 0 4px;font-size:17px}
.idea .why{color:var(--muted);font-size:14px;margin:0 0 6px}
.idea details{font-size:14px;margin:4px 0 8px}
.idea .row{flex-wrap:wrap}
.aistatus{display:flex;gap:10px;align-items:center;color:var(--muted);font-size:14px;margin:6px 0 12px}
.spin{width:18px;height:18px;border-radius:50%;border:3px solid var(--line);border-top-color:#7b5cff;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.badge-now{font-size:12px;background:var(--accent-soft);color:var(--ink);border-radius:999px;padding:1px 7px}
.qty{font-weight:750;color:var(--accent);margin-right:2px;white-space:nowrap}
.item.done .qty{color:inherit}
.guests{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:8px 10px 8px 14px;margin:0 0 12px;flex-wrap:wrap}
.guests .lbl{flex:1;min-width:150px;font-weight:650}
.guests .lbl small{display:block;color:var(--muted);font-weight:500;font-size:12px}
.stepper{display:flex;align-items:center;gap:4px}
.stepper button{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--bg);font-size:20px;font-weight:700}
.stepper b{min-width:34px;text-align:center;font-size:20px}
.qadd{display:flex;gap:8px;margin:4px 0 12px}
.qadd input{flex:1;min-width:0;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:12px;font-size:16px}
.qadd input:focus{outline:2px solid var(--accent);border-color:transparent}
.cartcard{display:flex;align-items:center;gap:14px;width:100%;border:0;text-align:left;background:var(--accent);color:var(--accent-ink);border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow);margin:0 0 6px}
.cartcard .emo{font-size:34px}
.cartcard b{font-size:18px;display:block}
.donehead{display:flex;justify-content:space-between;align-items:center;margin:22px 4px 8px;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
nav.tabs button .cnt{position:absolute;margin:-6px 0 0 26px;background:var(--coral);color:#fff;border-radius:999px;font-size:10px;padding:1px 5px;line-height:1.4}
.progress{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin:2px 0 14px}
.progress span{display:block;height:100%;background:var(--accent);transition:width .2s}
.inglist{margin:0 0 14px;padding:10px 12px 10px 30px;background:var(--card);border-radius:12px;box-shadow:var(--shadow)}
.inglist li{padding:2px 0}
.steps-text{white-space:pre-wrap;background:var(--card);border-radius:12px;padding:10px 12px;box-shadow:var(--shadow);margin:0 0 14px;font-size:15px}
.empty{text-align:center;color:var(--muted);padding:40px 10px}
.stale{background:#fff3d6;color:#6a4a00;border-radius:12px;padding:10px 12px;font-size:14px;margin:0 0 12px}
@media (prefers-color-scheme: dark){.stale{background:#3a3016;color:#f4dc9a}}
details.hidden-items{margin-top:18px;color:var(--muted)}
details.hidden-items summary{cursor:pointer;font-size:14px;margin:0 4px 8px}
.kbdhint{color:var(--muted);font-size:13px;margin:18px 4px;display:none;gap:14px;flex-wrap:wrap}
@media (min-width:960px) and (hover:hover){.kbdhint{display:flex}}

/* Auswahl-Leiste */
.selbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tab) + 16px + env(safe-area-inset-bottom));z-index:12;
  background:var(--ink);color:var(--bg);border-radius:16px;padding:8px;display:flex;gap:6px;align-items:center;box-shadow:0 10px 30px rgba(0,0,0,.25);max-width:calc(100vw - 24px);overflow-x:auto}
.selbar .cnt{padding:0 10px;font-weight:700;white-space:nowrap}
.selbar button{border:0;border-radius:10px;padding:9px 12px;background:color-mix(in srgb,var(--bg) 14%,transparent);color:var(--bg);font-weight:650;white-space:nowrap;display:flex;gap:6px;align-items:center}
.selbar button:hover{background:color-mix(in srgb,var(--bg) 26%,transparent)}
.selbar kbd{font:600 11px/1 ui-monospace,monospace;border:1px solid color-mix(in srgb,var(--bg) 40%,transparent);border-radius:4px;padding:2px 4px;opacity:.8}
@media (min-width:960px){.selbar{left:calc(50% + 140px)}}

.fab{position:fixed;right:max(18px,env(safe-area-inset-right));bottom:calc(var(--tab) + 18px + env(safe-area-inset-bottom));width:60px;height:60px;border-radius:20px;border:0;background:var(--coral);color:#fff;font-size:32px;font-weight:300;box-shadow:0 8px 24px rgba(255,122,89,.45);z-index:6}
@media (min-width:960px){.fab{right:32px;bottom:28px}}

/* ---------- Rezepte ---------- */
.rtools{display:flex;gap:8px;margin:4px 0 10px}
.search{flex:1;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:11px 12px;min-width:0}
.search:focus{outline:2px solid var(--accent);border-color:transparent}
.filters{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none;flex-wrap:nowrap}
.filters::-webkit-scrollbar{display:none}
@media (min-width:960px){.filters{flex-wrap:wrap}}
.fchip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 12px;font-size:14px;font-weight:600;white-space:nowrap;flex:none}
.fchip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.fchip.now:not(.on){border-color:var(--accent);color:var(--accent)}
select.fchip{appearance:none;-webkit-appearance:none;padding-right:26px;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 14px) 52%,calc(100% - 9px) 52%;background-size:5px 5px;background-repeat:no-repeat}
select.fchip.on{background-image:linear-gradient(45deg,transparent 50%,var(--accent-ink) 50%),linear-gradient(135deg,var(--accent-ink) 50%,transparent 50%)}
.rcount{color:var(--muted);font-size:14px;margin:4px 2px 10px;display:flex;justify-content:space-between;gap:8px}
.rcount button{border:0;background:transparent;color:var(--accent);font-weight:600;font-size:14px;padding:0}
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
@media (min-width:600px){.rgrid{grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}}
.rcard{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;border:0;padding:0;text-align:left;display:flex;flex-direction:column}
.rcard:hover{outline:2px solid var(--accent-soft)}

.rph{aspect-ratio:4/3;width:100%;display:grid;place-items:center;font-size:44px;background:linear-gradient(135deg,var(--accent-soft),var(--coral-soft))}
.rbody{padding:10px 12px 12px;display:flex;flex-direction:column;gap:5px;flex:1}
.rtitle{font-weight:700;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rmeta{display:flex;flex-wrap:wrap;gap:4px 8px;font-size:13px;color:var(--muted);align-items:center}
.rsrc{font-size:12px;color:var(--muted);margin-top:auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.rate{display:flex;gap:2px}
.rate button{border:0;background:transparent;font-size:30px;line-height:1;padding:2px;color:var(--line)}
.rate button.on{color:var(--star)}
.ratings{display:flex;flex-direction:column;gap:6px;margin:6px 0 14px}

.ratings .who b{min-width:70px}
.dimg{width:100%;max-height:300px;object-fit:cover;border-radius:14px;display:block;background:var(--line);margin-bottom:12px}
.tagrow{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
.tag{font-size:13px;border-radius:999px;padding:4px 10px;background:var(--accent-soft);color:var(--ink);font-weight:600}

.scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:20;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--bg);border-radius:22px 22px 0 0;max-height:90vh;overflow:auto;
  transform:translateY(105%);transition:transform .25s ease;padding:8px 0 calc(20px + env(safe-area-inset-bottom))}
.sheet.on{transform:none}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 12px}

  .sheet{left:50%;right:auto;bottom:auto;top:50%;width:min(620px,92vw);max-height:88vh;border-radius:20px;opacity:0;pointer-events:none;

.row > .field{flex:1}
.menu{display:flex;flex-direction:column;background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;margin-bottom:14px}
.menu > button,.menu > label{border:0;border-top:1px solid var(--line);background:transparent;text-align:left;padding:13px 16px;display:flex;gap:12px;align-items:center;cursor:pointer}
.menu > :first-child{border-top:0}
.menu > button:hover,.menu > label:hover{background:color-mix(in srgb,var(--accent-soft) 50%,transparent)}
.menu button.danger{color:var(--danger)}
.menu small{display:block;color:var(--muted);font-size:13px}
.menu .grow{flex:1}

.chips.txt button{font-size:14px;font-weight:600;padding:7px 12px}
.chips button.on{border-color:var(--accent);background:var(--accent-soft)}
.toast{position:fixed;left:50%;bottom:calc(var(--tab) + 96px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);
  padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;transition:all .2s;z-index:40;max-width:90vw;text-align:center;pointer-events:none}

.banner{background:var(--accent-soft);border-radius:12px;padding:12px;margin:0 0 14px;font-size:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.muted{color:var(--muted);font-size:14px}
code{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:1px 5px;font-size:13px;word-break:break-all}
.photoBox img{display:block;width:100%;max-height:240px;object-fit:cover;border-radius:12px;margin-bottom:8px;background:var(--line)}
.viewer{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.92);display:none;flex-direction:column;align-items:center;justify-content:center;padding:20px;gap:12px}

    for (const x of xb) { if (m.has(x.id)) m.set(x.id, combine(m.get(x.id), x)); else { m.set(x.id, x); order.push(x.id); } }

    listOrderU: Math.max(A.listOrderU, B.listOrderU), catOrderU: Math.max(A.catOrderU, B.catOrderU)};

    B.listOrderU > A.listOrderU ? B.lists : A.lists);
  for (const l of out.lists) l.items = l.items.filter(it => alive('item:'+it.id, it.u));
  out.recipes = byId(A.recipes, B.recipes, 'recipe', (a,b) => {
    const r = {...newer(a,b)}, rt = {...a.ratings};
    for (const [k,v] of Object.entries(b.ratings)) if (!rt[k] || v.u > rt[k].u) rt[k] = v;

/* Instagram-Caption & Co.: Zutaten, Zubereitung, Portionen und Titel erkennen */
function parseCaption(text){
  const raw = String(text || '').replace(/\r/g, '').split('\n');
  const strip = s => s.replace(/^[\s\p{Extended_Pictographic}\uFE0F\u200d•·▪◦‣⁃*✓✔►▶→➡>_~\-–—]+/u, '').replace(/[\s\uFE0F]+$/u, '').trim();
  const lines = raw.map(l => ({orig: l.trim(), t: strip(l)}));
  const head = /^(zutaten|ingredients|du brauchst|was du brauchst|das brauchst du|einkaufsliste)\b/i;
  const stop = /^(zubereitung|so geht'?s|und so geht'?s|anleitung|instructions|method|directions|schritte|steps|so wird'?s gemacht|los geht'?s)\b/i;
  const qty = /^((\d+([.,/]\d+)?|[½¼¾⅓⅔⅛])\s*(-\s*\d+\s*)?(g|kg|ml|l|el|tl|stk|stück|pck|päckchen|prise|dose|bund|zehe|zehen|cups?|tbsp|tsp|oz|scheiben?|handvoll)?\b|(eine?n?|zwei|drei|vier|fünf|etwas|prise|handvoll|ein paar|ein schuss|1\/2)\s)/i;
  const servingsM = String(text).match(/(?:für|for|ergibt|reicht für)?\s*(\d{1,2})\s*(portionen|portion|personen|servings|stück)/i);
  let ing = [], steps = [], mode = 'pre', found = false;
  for (const {orig, t} of lines) {
    if (!t) continue;
    if (/^#\w/.test(orig) && !/^#\d/.test(orig)) { if (mode !== 'pre') mode = 'end'; continue; }
    if (head.test(t)) { found = true; mode = 'ing';
      const rest = t.replace(head, '').replace(/^[^:]*:\s*/, '').replace(/^\(.*?\)\s*:?\s*/, '');
      if (rest && rest.length > 2 && !/^für\s/i.test(rest)) rest.split(/\s*[,;]\s*/).forEach(x => x && ing.push(x));
      continue; }
    if (stop.test(t)) { mode = 'steps'; const rest = t.replace(stop, '').replace(/^[:\s]+/, ''); if (rest) steps.push(rest); continue; }
    if (mode === 'ing') { if (/:$/.test(t) && t.length < 40) continue; ing.push(t.replace(/^\d+[.)]\s+(?=\D)/, '')); }
    else if (mode === 'steps') steps.push(orig.replace(/^[\s\uFE0F]+/, ''));
  }
  if (!found) {        // ohne Überschrift: Zeilen mit Mengenangabe sammeln
    ing = lines.filter(({t}) => t && t.length < 70 && qty.test(t) && !/^\d+[.)]\s/.test(t)).map(({t}) => t);
  }
  const first = lines.find(({t}) => t && !head.test(t) && !/^#/.test(t) && !qty.test(t));
  const title = first ? first.t.replace(/^@?[a-z0-9_]+[._][a-z0-9_.]+\s+/i, '').replace(/[\s\p{Extended_Pictographic}\uFE0F\u200d:!.]+$/u, '').slice(0, 80) : '';
  return {ingredients: [...new Set(ing.map(x => x.replace(/\s+/g, ' ').trim()).filter(x => x.length > 1))],
    steps: steps.join('\n').trim(), servings: servingsM ? +servingsM[1] : 0, title};
}

function shrinkPhoto(file, max = 640, q = 0.72){
  return new Promise((res, rej) => {
    const img = new Image(), u = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement('canvas');
      c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
      const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0,0,c.width,c.height);
      g.drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(u);
      res(c.toDataURL('image/jpeg', q));
    };
    img.onerror = () => { URL.revokeObjectURL(u); rej(new Error('Bild konnte nicht gelesen werden')); };
    img.src = u;
  });
}
function dataUrlBytes(d){ const b = atob(d.split(',')[1]), a = new Uint8Array(b.length); for (let i=0;i<b.length;i++) a[i] = b.charCodeAt(i); return a; }

/* ---------- ZIP (unkomprimiert, ohne Bibliothek) ---------- */
const CRC = (()=>{ const t=new Uint32Array(256); for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0;} return t; })();
const crc32 = b => { let c=0xFFFFFFFF; for (let i=0;i<b.length;i++) c=CRC[(c^b[i])&255]^(c>>>8); return (c^0xFFFFFFFF)>>>0; };
function makeZip(files){
  const enc = new TextEncoder(), parts = [], central = []; let off = 0;
  for (const f of files){
    const name = enc.encode(f.name), body = f.bytes || enc.encode(f.text), crc = crc32(body);
    const h = new DataView(new ArrayBuffer(30));
    h.setUint32(0,0x04034b50,true); h.setUint16(4,20,true); h.setUint16(6,0x0800,true); h.setUint16(8,0,true);
    h.setUint16(10,0,true); h.setUint16(12,0x21,true); h.setUint32(14,crc,true);
    h.setUint32(18,body.length,true); h.setUint32(22,body.length,true); h.setUint16(26,name.length,true); h.setUint16(28,0,true);
    parts.push(h, name, body);
    const c = new DataView(new ArrayBuffer(46));
    c.setUint32(0,0x02014b50,true); c.setUint16(4,20,true); c.setUint16(6,20,true); c.setUint16(8,0x0800,true);
    c.setUint16(10,0,true); c.setUint16(12,0,true); c.setUint16(14,0x21,true); c.setUint32(16,crc,true);
    c.setUint32(20,body.length,true); c.setUint32(24,body.length,true); c.setUint16(28,name.length,true);
    c.setUint32(42,off,true);
    central.push(c, name);
    off += 30 + name.length + body.length;
  }
  const csize = central.reduce((s,p)=>s+p.byteLength,0);
  const e = new DataView(new ArrayBuffer(22));
  e.setUint32(0,0x06054b50,true); e.setUint16(8,files.length,true); e.setUint16(10,files.length,true);
  e.setUint32(12,csize,true); e.setUint32(16,off,true);
  return new Blob([...parts, ...central, e], {type:'application/zip'});
}
function download(blob, name){
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();}, 500);
}

/* =====================================================================
   GitHub-Sync: daten.json, Bring-Seiten und Fotos direkt ins Repository
   ===================================================================== */
const sync = {state: local.gh.token ? 'idle' : 'off', msg: '', busy: false, again: false, timer: null};
function ghCfg(){
  const g = local.gh; let owner = g.owner, repo = g.repo;
  if (!owner || !repo) {
    const m = (location.hostname.match(/^([^.]+)\.github\.io$/));
    const seg = location.pathname.split('/').filter(Boolean)[0];
    if (m && seg) { owner = owner || m[1]; repo = repo || seg; }
    else { const d = DEFAULT_BASE.match(/^https:\/\/([^.]+)\.github\.io\/([^/]+)\//); owner = owner || d[1]; repo = repo || d[2]; }
  }
  return {owner, repo, branch: g.branch || 'main', token: g.token || ''};
}
const ghReady = () => !!local.gh.token;
async function gh(path, opts = {}){
  const c = ghCfg();
  const r = await fetch(`https://api.github.com/repos/${c.owner}/${c.repo}${path ? '/' + path : ''}`, {
    ...opts, cache:'no-store',
    headers: {'Accept':'application/vnd.github+json', 'Authorization':'Bearer '+c.token, 'X-GitHub-Api-Version':'2022-11-28', ...(opts.headers||{})}
  });
  if (r.status === 404) return null;
  if (!r.ok) { const t = await r.text().catch(()=>''); const e = new Error(r.status + ' ' + t.slice(0,140)); e.status = r.status; throw e; }
  return r.status === 204 ? {} : r.json();
}
const b64utf8 = s => { const b = new TextEncoder().encode(s); let x = ''; for (let i=0;i<b.length;i+=0x8000) x += String.fromCharCode(...b.subarray(i,i+0x8000)); return btoa(x); };
const utf8b64 = s => new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\s/g,'')), c=>c.charCodeAt(0)));
async function ghGet(path){ const c = ghCfg(); const r = await gh(`contents/${path}?ref=${c.branch}&t=${now()}`); return r && !Array.isArray(r) ? {sha:r.sha, text: r.content ? utf8b64(r.content) : null} : null; }
async function ghDir(path){ const c = ghCfg(); const r = await gh(`contents/${path}?ref=${c.branch}&t=${now()}`); const m = {}; if (Array.isArray(r)) for (const f of r) m[f.name] = f.sha; return m; }
async function ghPut(path, b64, sha, msg){
  const c = ghCfg();
  return gh(`contents/${path}`, {method:'PUT', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({message: msg || ('bring+: ' + path), content: b64, branch: c.branch, ...(sha ? {sha} : {})})});
}
function setSync(state, msg){ sync.state = state; sync.msg = msg || ''; renderSyncBadge(); if (location.hash === '#/einstellungen' && !document.activeElement?.matches('input')) viewSettings(); }
function scheduleSync(){ if (!ghReady() || local.gh.auto === false) return; clearTimeout(sync.timer); sync.timer = setTimeout(syncNow, 2500); }

async function syncNow(manual){
  if (!ghReady()) { if (manual) { location.hash = '#/einstellungen'; toast('Bitte zuerst den GitHub-Sync einrichten'); } return; }
  if (sync.busy) { sync.again = true; return; }
  sync.busy = true; setSync('busy', 'Synchronisiere …');
  try {
    // 1) neue Fotos hochladen und durch Dateipfade ersetzen
    const photos = [];
    for (const l of data.lists) for (const it of l.items) if (it.photo?.startsWith('data:')) photos.push({o:it, k:'photo', p:photoPath('',it.id)});
    for (const r of data.recipes) if (r.image?.startsWith('data:')) photos.push({o:r, k:'image', p:photoPath('r-',r.id)});
    if (photos.length) {
      const dir = await ghDir('fotos');
      for (const f of photos) {
        await ghPut(f.p, f.o[f.k].split(',')[1], dir[f.p.split('/')[1]], 'bring+: Foto');
        f.o[f.k] = f.p; touch(f.o);
      }
    }
    // 2) daten.json holen, zusammenführen, zurückschreiben (bei Konflikt nochmal)
    for (let attempt = 0; attempt < 3; attempt++) {
      const remote = await ghGet('daten.json');
      let rd = null; try { rd = remote?.text ? JSON.parse(remote.text) : null; } catch(e) {}
      const merged = rd ? mergeData(data, rd) : normalize(JSON.parse(JSON.stringify(data)));
      const changedLocal = !sameData(merged, data);
      data = merged; save({noSync:true});
      if (changedLocal) route(true);
      const text = dataText(data);
      if (rd && sameData(rd, data)) break;
      try { await ghPut('daten.json', b64utf8(text), remote?.sha, 'bring+: Listen & Rezepte'); break; }
      catch(e) { if ((e.status === 409 || e.status === 422) && attempt < 2) continue; throw e; }
    }
    // 3) Bring-Seiten der geänderten Listen
    const base = hostedBase(), dir = await ghDir('listen');
    for (const l of data.lists) {
      if (l.kind === 'pack' || l.kind === 'cart') continue;
      const html = bringPageHtml(l, base), sha = await gitSha(html), name = l.id + '.html';
      if (sha && dir[name] === sha) continue;                       // unverändert → kein Commit
      await ghPut('listen/' + name, b64utf8(html), dir[name], 'bring+: Bring-Seite ' + l.name);
    }
    // 4) Bring-Seiten für Rezepte mit eigenen Zutaten (z. B. aus Instagram)
    const withIng = data.recipes.filter(r => r.ingredients.length);
    if (withIng.length) {
      const rdir = await ghDir('rezepte');
      for (const r of withIng) {
        const html = recipePageHtml(r, base), sha = await gitSha(html), name = r.id + '.html';
        if (sha && rdir[name] === sha) continue;
        await ghPut('rezepte/' + name, b64utf8(html), rdir[name], 'bring+: Rezept ' + r.title);
      }
    }
    local.gh.last = now(); saveLocal();
    setSync('ok', 'Synchron');
  } catch(e) {
    console.warn(e);
    setSync('err', e.status === 401 ? 'Token ungültig oder abgelaufen' : e.status === 403 ? 'Token hat keine Schreibrechte (Contents: Read and write)' :
      e.status === 404 ? 'Repository nicht gefunden' : navigator.onLine === false ? 'Offline – später erneut' : 'Fehler: ' + e.message);
    if (manual) toast(sync.msg, 4000);
  } finally {
    sync.busy = false;
    if (sync.again) { sync.again = false; setTimeout(syncNow, 300); }
  }
}

}

const QTY_RE = /^((?:ca\.\s*)?(?:\d+(?:[.,/]\d+)?|[½¼¾⅓⅔⅛])\s*(?:-\s*\d+\s*)?(?:g|kg|mg|ml|l|cl|el|tl|stk\.?|stück|pck\.?|päckchen|pkg|prise[n]?|dose[n]?|bund|zehe[n]?|becher|glas|gläser|scheibe[n]?|handvoll|tasse[n]?|cups?|tbsp|tsp|msp\.?)?\.?)\s+(.+)$/i;
function splitIngredient(t){
  const m = String(t).trim().match(QTY_RE);
  return m ? {name: m[2].replace(/^(von\s+)/i,'').trim(), spec: m[1].trim()} : {name: String(t).trim(), spec: ''};
}
function guessCat(name){
  const k = keyOf(name); let best = null, bl = 0;
  for (const l of data.lists) for (const it of l.items) {
    const n = keyOf(it.name); if (!it.cat || !n) continue;
    if (n === k) return it.cat;
    if ((k.includes(n) || n.includes(k)) && n.length > bl && n.length > 2) { best = it.cat; bl = n.length; }
  }
  return best || '';
}
/* Artikel auf den Zettel: Dubletten überspringen, bereits abgehakte wieder öffnen */
function toCart(entries, cartId){
  const c = listById(cartId) || cartList(); if (!c) return {added:0, reopened:0, skipped:0};
  let added = 0, reopened = 0, skipped = 0, merged = 0;
  for (const e of entries) {
    const ex = c.items.find(i => itemKey(i) === itemKey(e));
    if (ex) {
      if (ex.done) { delete ex.done; if (e.qty) { ex.qty = e.qty; ex.unit = e.unit || ''; } touch(ex); reopened++; }
      else if (e.qty && ex.qty && (ex.unit || '') === (e.unit || '')) { ex.qty = Math.round((ex.qty + e.qty) * 100) / 100; touch(ex); merged++; }
      else skipped++;
      continue;
    }
    c.items.push({id: uid(), name: e.name, spec: e.spec || '', cat: e.cat || guessCat(e.name), ...(e.photo ? {photo: e.photo} : {}),
      ...(e.qty ? {qty: e.qty, unit: e.unit || ''} : {}), u: now()}); added++;
  }
  save(); return {added, reopened, skipped, merged, cart: c};
}
const cartMsg = r => `${r.added + r.reopened} Artikel auf „${r.cart.name}“` + (r.merged ? ` · bei ${r.merged} Menge erhöht` : '') + (r.skipped ? ` · ${r.skipped} standen schon drauf` : '');
function toggleDone(cid, iid){
  const c = listById(cid), it = c?.items.find(i => i.id === iid); if (!it) return;
  if (it.done) delete it.done; else it.done = now();
  touch(it); save(); viewList(c);
}
function clearDone(cid){
  const c = listById(cid), d = c.items.filter(i => i.done); if (!d.length) return;
  c.items = c.items.filter(i => !i.done); d.forEach(i => tomb('item', i.id)); save(); viewList(c); toast(d.length + ' erledigte Artikel entfernt');
}
function quickAdd(cid, text){
  const parts = String(text).split(/\s*[,;\n]\s*/).map(x => x.trim()).filter(Boolean); if (!parts.length) return;
  const r = toCart(parts.map(t => { const s = t.match(/^(.+?)\s*\((.+)\)$/); const q = parseQtyText(s ? s[1] : t);
    return {name: q.name, spec: s ? s[2] : '', qty: q.qty, unit: q.unit}; }), cid);
  viewList(r.cart); setTimeout(() => $('#qa')?.focus(), 30);
  if (r.skipped) toast(r.skipped === parts.length ? 'Steht schon auf dem Zettel' : cartMsg(r));

      if (act === 'hide') return hideItem(l.id, iid);
      if (act === 'edit') { ui.cur = k; return editItem(fid, iid, l.id); }
      if (l.kind === 'pack' && !act && !e.ctrlKey && !e.metaKey && !e.shiftKey && !ui.selmode) { ui.cur = k; togglePacked(l.id, k); return viewList(l); }
      if (act === 'sel' || e.ctrlKey || e.metaKey || ui.selmode) { toggleSel(k); ui.cur = k; ui.lastClick = k; return refreshRows(l); }
      if (e.shiftKey && ui.lastClick) {
        const a = ui.rows.indexOf(ui.lastClick), b = ui.rows.indexOf(k);
        ui.rows.slice(Math.min(a,b), Math.max(a,b)+1).forEach(x=>ui.sel.add(x)); ui.cur = k; return refreshRows(l);
      }
      ui.cur = k; ui.lastClick = k; editItem(fid, iid, l.id);
    };
    el.ondragstart = e => {
      const keys = ui.sel.has(k) ? [...ui.sel] : [k];
      e.dataTransfer.setData('text/x-bringplus', JSON.stringify(keys)); e.dataTransfer.effectAllowed = 'copyMove';
    };
  });
}
function refreshRows(l){

}
function toggleSel(k){ ui.sel.has(k) ? ui.sel.delete(k) : ui.sel.add(k); }
function toggleSelMode(){

const resolve = k => { const [fid, iid] = k.split(':'); const l = listById(fid); const it = l?.items.find(i=>i.id===iid); return it ? {l, it} : null; };

/* ---------- Kopieren / Verschieben ---------- */
function copyDialog(keys, fromList, mode = 'copy'){
  keys = keys.filter(resolve); if (!keys.length) return;
  const targets = data.lists.filter(t => t.id !== fromList?.id);
  const picked = new Set(local.lastTargets?.filter(id => targets.some(t=>t.id===id)) || []);
  const names = keys.map(k => resolve(k).it.name);
  openSheet(`<h2>${keys.length === 1 ? '„'+esc(names[0])+'“' : keys.length + ' Artikel'} ${mode==='move'?'verschieben':'kopieren'} nach …</h2>
    <div class="menu" id="cdList">${targets.map((t,i) => {
      const has = keys.filter(k => effective(t).some(e => itemKey(e.it) === itemKey(resolve(k).it))).length;
      return `<label><input type="checkbox" value="${esc(t.id)}" ${picked.has(t.id)?'checked':''}>
        <span style="font-size:20px">${esc(t.emoji)}</span><span class="grow">${esc(t.name)}${t.kind==='base'?' <small style="display:inline">· Baustein</small>':''}
        ${has ? `<small>${has === keys.length ? 'schon vorhanden' : has + ' schon vorhanden'}</small>` : ''}</span>${i<9?`<span class="kbd">${i+1}</span>`:''}</label>`; }).join('')}</div>
    <p class="muted" style="margin-top:-6px">Tipp: Gemeinsame Artikel in einen <b>Baustein</b> verschieben – dann stehen sie automatisch in allen Listen, die ihn einbinden.</p>
    <div class="row"><button class="btn grow" id="cdMove">➜ Verschieben <kbd>⇧ Enter</kbd></button>
      <button class="btn primary grow" id="cdCopy">⧉ Kopieren <kbd>Enter</kbd></button></div>`,
  () => {
    const sel = () => $$('#cdList input:checked').map(x=>x.value);
    const go = m => { const t = sel(); if (!t.length) return toast('Bitte mindestens eine Liste wählen'); local.lastTargets = t; saveLocal(); closeSheet(); transfer(keys, t, m); };
    $('#cdCopy').onclick = () => go('copy'); $('#cdMove').onclick = () => go('move');
    if (mode === 'move') { $('#cdMove').classList.add('primary'); $('#cdCopy').classList.remove('primary'); }
    $('#sheet').onkeydown = e => {
      if (/^[1-9]$/.test(e.key)) { const cb = $$('#cdList input')[+e.key-1]; if (cb) { cb.checked = !cb.checked; e.preventDefault(); } }
      else if (e.key === 'Enter') { e.preventDefault(); go(e.shiftKey || (mode==='move' && !e.ctrlKey) ? 'move' : 'copy'); }
    };
    ($$('#cdList input')[0] || $('#cdCopy')).focus({preventScroll:true});
  });
}
function transfer(keys, targetIds, mode){
  const src = keys.map(resolve).filter(Boolean);
  const carts = targetIds.filter(t => listById(t)?.kind === 'cart');
  for (const cid of carts) { const r = toCart(src.map(s => s.it), cid); toast(cartMsg(r)); }
  targetIds = targetIds.filter(t => !carts.includes(t)); if (!targetIds.length) { ui.sel.clear(); route(); return; }
  let added = 0, skipped = 0;
  for (const tid of targetIds) {
    const t = listById(tid); if (!t) continue;
    for (const {l, it} of src) {
      if (l.id === t.id) { if (mode === 'copy') skipped++; continue; }
      if (effective(t).some(e => itemKey(e.it) === itemKey(it))) { skipped++; continue; }
      t.items.push({id:uid(), name:it.name, spec:it.spec, cat:it.cat, ...(it.photo?{photo:it.photo}:{}), u:now()}); added++;
    }
  }
  if (mode === 'move') for (const {l, it} of src) if (!targetIds.includes(l.id)) { l.items = l.items.filter(x=>x!==it); tomb('item', it.id); }
  ui.sel.clear(); save();
  const tn = targetIds.length === 1 ? '„' + listById(targetIds[0]).name + '“' : targetIds.length + ' Listen';
  toast((mode==='move' ? `${src.length} Artikel nach ${tn} verschoben` : `${added} × nach ${tn} kopiert`) + (skipped ? ` · ${skipped} schon vorhanden` : ''));
  route();
}
function deleteItems(keys, l){
  const src = keys.map(resolve).filter(Boolean); if (!src.length) return;
  const inh = src.filter(s => s.l.id !== l.id);
  const msg = src.length === 1 ? `„${src[0].it.name}“ löschen?` : `${src.length} Artikel löschen?`;
  if (!confirm(msg + (inh.length ? `\n\n${inh.length} davon stammen aus einem Baustein und verschwinden damit aus allen Listen, die ihn nutzen. (Nur hier ausblenden: 👁)` : ''))) return;
  for (const {l:sl, it} of src) { sl.items = sl.items.filter(x=>x!==it); tomb('item', it.id); }
  ui.sel.clear(); save(); route(); toast(src.length === 1 ? `„${src[0].it.name}“ gelöscht` : `${src.length} Artikel gelöscht`);
}
function hideItem(lid, iid){ const l = listById(lid); if (!l.excludes.includes(iid)) l.excludes.push(iid); touch(l); save(); route(); toast('In dieser Liste ausgeblendet'); }
function unhide(lid, iid){ const l = listById(lid); l.excludes = l.excludes.filter(x=>x!==iid); touch(l); save(); route(); }

      let name = $('#iName').value.trim(); if (!name) { $('#iName').focus(); return false; }
      if (!$('#iQty').value.trim()) { const pq = parseQtyText(name); if (pq.qty && pq.name) { name = pq.name; $('#iQty').value = String(pq.qty).replace('.', ','); if (pq.unit) $('#iUnit').value = pq.unit; } }
      const vals = {name, spec: $('#iSpec').value.trim(), cat: $('#iCat').value};
      const qv = num($('#iQty').value || '0'); if (qv > 0) { vals.qty = qv; vals.unit = UNIT_ALIAS[$('#iUnit').value.trim().toLowerCase()] || $('#iUnit').value.trim(); } else { vals.qty = 0; vals.unit = ''; }
      vals.fix = !!$('#iFix')?.checked; vals.grp = $('#iGrp')?.value || '';
      local.lastCat = vals.cat; saveLocal();
      const tl = it ? l : listById($('#iTarget')?.value) || l;
      if (!it && effective(viewL || tl).some(e => itemKey(e.it) === itemKey(vals))) { toast(`„${itemLine(vals)}“ steht schon auf der Liste`); return false; }
      let target = it; if (!target) { target = {id:uid()}; tl.items.push(target); }
      const before = {...target};
      Object.assign(target, vals); if (photo) target.photo = photo; else delete target.photo;
      if (!target.qty) { delete target.qty; delete target.unit; } if (!target.fix) delete target.fix; if (!target.grp) delete target.grp; touch(target);
      if (!save()) { if (it) { Object.keys(target).forEach(k=>delete target[k]); Object.assign(target, before); } else tl.items = tl.items.filter(x=>x!==target); return false; }
      if (viewL) { ui.cur = (tl.id) + ':' + target.id; viewList(viewL); }
      return true;
    };
    $('#iOk').onclick = () => { if (commit()) closeSheet(); };
    $('#iSpec').onkeydown = $('#iName').onkeydown = e => { if (e.key==='Enter') { e.preventDefault(); if (commit()) it ? closeSheet() : editItem(viewL?.id || listId); } };
    if (it) {
      $('#iDel').onclick = () => { closeSheet(); deleteItems([l.id+':'+it.id], viewL || l); };
      $('#iCopy').onclick = () => copyDialog([l.id+':'+it.id], viewL || l);
    } else $('#iMore').onclick = () => { if (commit()) { toast('Hinzugefügt'); editItem(viewL?.id || listId); } };
  });
}

      ${K('Entf','Löschen')}${K('D','Liste duplizieren')}${K('E','Auf den Einkaufszettel')}${K('B','In Bring importieren')}${K('P','Packliste: abhaken')}</div>
    <div class="sec">Im Kopieren-Dialog</div>

document.addEventListener('keydown', e => {
  const tag = (e.target.tagName||'').toLowerCase();
  const typing = ['input','textarea','select'].includes(tag) && e.target.type !== 'checkbox';
  if (e.key === 'Escape') {
    if ($('#viewer').classList.contains('on')) return $('#viewer').classList.remove('on');
    if (sheetOpen()) return closeSheet();
    if (typing) return e.target.blur();
    if (ui.sel.size) { ui.sel.clear(); const l = currentList(); if (l) refreshRows(l); }
    return;
  }
  if (typing || sheetOpen() || e.altKey || ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() !== 'a')) return;
  const k = e.key, l = currentList();
  const ordered = orderedLists();
  if (/^[1-9]$/.test(k) && ordered[+k-1]) { location.hash = '#/liste/' + encodeURIComponent(ordered[+k-1].id); return; }
  if (k === '?') { e.preventDefault(); return showKeys(); }
  if (k === 'r' || k === 'R') { location.hash = '#/rezepte'; return; }
  if (k === 'z' || k === 'Z') { openCart(); return; }
  if (k === 'i' || k === 'I') { e.preventDefault(); aiDialog(l?.id); return; }
  if (l?.kind === 'cart') { if (k === 'n' || k === 'N' || k === '+') { e.preventDefault(); $('#qa')?.focus(); } return; }
  if ((k === 'e' || k === 'E') && l && l.kind !== 'pack') { toCartDialog(l.id, ui.sel.size ? [...ui.sel] : null); return; }
  if (k === 'h' || k === 'H') { location.hash = ''; return; }
  if (k === 's' || k === 'S') { syncNow(true); return; }
  if (location.hash.startsWith('#/rezepte')) {
    if (k === '/') { e.preventDefault(); $('#rq')?.focus(); }
    if (k === 'n' || k === 'N') { e.preventDefault(); editRecipe(); }
    return;
  }
  if (!l) return;
  const rows = ui.rows, i = rows.indexOf(ui.cur);
  const move = d => { e.preventDefault();
    const ni = i < 0 ? (d > 0 ? 0 : rows.length-1) : Math.max(0, Math.min(rows.length-1, i + d));
    if (e.shiftKey) { if (ui.cur) ui.sel.add(ui.cur); ui.sel.add(rows[ni]); }
    ui.cur = rows[ni]; refreshRows(l);
    document.querySelector(`.item[data-k="${CSS.escape(ui.cur)}"]`)?.scrollIntoView({block:'nearest'}); };
  const targetKeys = () => ui.sel.size ? [...ui.sel] : (ui.cur ? [ui.cur] : []);
  switch (k) {
    case 'ArrowDown': case 'j': case 'J': return move(1);
    case 'ArrowUp': case 'k': case 'K': return move(-1);
    case ' ': e.preventDefault(); if (ui.cur) { toggleSel(ui.cur); refreshRows(l); } return;
    case 'a': case 'A': e.preventDefault(); rows.forEach(r=>ui.sel.add(r)); return refreshRows(l);
    case 'c': case 'C': if (targetKeys().length) copyDialog(targetKeys(), l); else toast('Erst einen Artikel wählen (↑ ↓)'); return;
    case 'v': case 'V': case 'm': case 'M': if (targetKeys().length) copyDialog(targetKeys(), l, 'move'); return;
    case 'Enter': if (ui.cur) { const [fid, iid] = ui.cur.split(':'); editItem(fid, iid, l.id); } return;
    case 'n': case 'N': case '+': e.preventDefault(); return editItem(l.id);
    case 'Delete': case 'Backspace': if (targetKeys().length) { e.preventDefault(); deleteItems(targetKeys(), l); } return;
    case 'd': case 'D': return dupList(l.id);
    case 'b': case 'B': return l.kind === 'pack' ? null : openInBring(l);
    case 'p': case 'P': if (l.kind === 'pack' && ui.cur) { togglePacked(l.id, ui.cur); viewList(l); } return;
  }
});

/* Instagram liefert die vollständige Caption oft nur auf der Einbettungsseite (…/embed/captioned/) */
async function fetchInstaCaption(url){
  const m = url.match(/instagram\.com\/(?:[\w.]+\/)?(?:p|reel|reels|tv)\/([\w-]+)/); if (!m) throw new Error('kein Instagram-Beitrag');
  const embed = `https://www.instagram.com/p/${m[1]}/embed/captioned/`;
  const rule = (n, sel, attr) => `&data.${n}.selector=${encodeURIComponent(sel)}&data.${n}.attr=${attr}`;
  const r = await fetch(PREVIEW_API + encodeURIComponent(embed) + '&meta=false' + rule('cap', '.Caption', 'html') + rule('img', '.EmbeddedMediaImage', 'src'));
  if (!r.ok) throw new Error('Caption nicht abrufbar');
  const j = await r.json(); if (j.status !== 'success') throw new Error('Caption nicht abrufbar');
  let html = String(j.data?.cap || '');
  html = html.replace(/<a[^>]*CaptionUsername[^>]*>.*?<\/a>/is, '').replace(/<div[^>]*CaptionComments[^>]*>.*$/is, '')
    .replace(/<br\s*\/?>/gi, '\n').replace(/<\/(p|div)>/gi, '\n');
  _tx.innerHTML = html.replace(/<[^>]+>/g, '');
  const caption = _tx.value.replace(/\n{3,}/g, '\n\n').replace(/(View all|Alle) \d+ (comments|Kommentare)( ansehen)?\s*$/i, '').trim();
  return {caption, image: j.data?.img || ''};
}
/* Texterkennung (OCR) für Screenshots – läuft komplett im Browser, Bild verlässt das Gerät nicht */
const OCR_LIB = 'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';
function loadScript(src){ return new Promise((res, rej) => { if (window.Tesseract) return res();
  const sc = document.createElement('script'); sc.src = src; sc.onload = res; sc.onerror = () => rej(new Error('Texterkennung konnte nicht geladen werden (Internet?)')); document.head.appendChild(sc); }); }
function prepForOcr(file){
  return new Promise((res, rej) => {
    const img = new Image(), u = URL.createObjectURL(file);
    img.onload = () => {
      const k = img.naturalWidth < 1100 ? 2 : 1, c = document.createElement('canvas');
      c.width = img.naturalWidth * k; c.height = img.naturalHeight * k;
      const g = c.getContext('2d'); g.imageSmoothingQuality = 'high'; g.drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(u);
      const d = g.getImageData(0, 0, c.width, c.height), a = d.data; let sum = 0;
      for (let i = 0; i < a.length; i += 4) { const y = .299*a[i] + .587*a[i+1] + .114*a[i+2]; a[i] = a[i+1] = a[i+2] = y; sum += y; }
      if (sum / (a.length/4) < 110) for (let i = 0; i < a.length; i += 4) a[i] = a[i+1] = a[i+2] = 255 - a[i];   // Dunkelmodus → invertieren
      g.putImageData(d, 0, 0); res(c);
    };
    img.onerror = () => { URL.revokeObjectURL(u); rej(new Error('Bild konnte nicht gelesen werden')); };
    img.src = u;
  });
}
async function ocrImages(files, onProgress){
  await loadScript(OCR_LIB);
  let cur = 0;
  const worker = await Tesseract.createWorker('deu', 1, {logger: m => { if (m.status === 'recognizing text') onProgress?.(Math.round(((cur + m.progress) / files.length) * 100));
    else if (/load|initializ/.test(m.status)) onProgress?.(-1); }});
  const texts = [];
  try { for (cur = 0; cur < files.length; cur++) { const { data } = await worker.recognize(await prepForOcr(files[cur])); texts.push(data.text); } }
  finally { await worker.terminate(); }
  // Instagram-Oberfläche und Überlappungen mehrerer Screenshots entfernen
  const noise = /^(\d{1,2}[:.]\d{2}\b.*|.*\b(gefällt|likes?|antworten|reply|übersetzung anzeigen|see translation|kommentar hinzufügen|add a comment|alle \d+ kommentare|view all|originalton|original audio|gesponsert|sponsored|folgen|follow|following|abonniert|bearbeitet|edited)\b.*|mehr|more|… ?mehr|vor \d+ \w+|\d+ (std|min|tage?|wochen?)\.?)$/i;
  const seen = new Set(), out = [];
  for (const line of texts.join('\n').split('\n')) {
    let t = line.replace(/^[^\p{L}\p{N}½¼¾⅓#]+/u, '').replace(/^[a-zA-Z]\s(?=\d)/, '').trim();
    if (!t) { if (out[out.length-1] !== '') out.push(''); continue; }
    if (noise.test(t) || t.length < 2) continue;
    const k = t.toLowerCase(); if (seen.has(k)) continue; seen.add(k); out.push(t);
  }
  return out.join('\n').trim();
}

async function fetchPreview(url){
  if (/instagram\.com/.test(url)) {
    const [pv, ec] = await Promise.allSettled([fetchPreviewRaw(url), fetchInstaCaption(url)]);
    const p = pv.status === 'fulfilled' ? pv.value : {title:'', image:'', desc:'', caption:'', insta:true, source:'Instagram'};
    const e = ec.status === 'fulfilled' ? ec.value : null;
    if (e && e.caption.length > (p.caption||'').replace(/…$/, '').length) p.caption = e.caption;
    if (!p.image && e?.image) p.image = e.image;
    if (pv.status !== 'fulfilled' && !e?.caption) throw new Error('Instagram blockiert den Abruf');
    return p;
  }
  return fetchPreviewRaw(url);
}
async function fetchPreviewRaw(url){
  const r = await fetch(PREVIEW_API + encodeURIComponent(url)); if (!r.ok) throw new Error('Vorschau nicht verfügbar');
  const j = await r.json(); if (j.status !== 'success') throw new Error('Vorschau nicht verfügbar');
  const d = j.data || {};
  const insta = /instagram\.com/.test(url);
  const cap = insta ? ((d.description||'').match(/:\s*["“](.*)["”]\s*$/s)?.[1] || (d.title||'').match(/["“](.*)["”]/s)?.[1] || '') : '';
  return {title: insta ? '' : (d.title||'').split(/\s[|·–]\s/)[0].trim(), image: d.image?.url || d.logo?.url || '',
    desc: insta ? '' : (d.description||'').slice(0,240), caption: cap, insta,
    source: insta ? 'Instagram' + (d.author ? ' · ' + d.author.replace(/^@?/, '@') : '') : (d.publisher || host(url))};
}
function guessTags(text){
  const t = keyOf(text);
  const g = {vegan: /vegan/.test(t), veggie: /vegan|vegetar|veggie/.test(t), seasons: [], course: ''};
  if (/kürbis|kuerbis|maronen|pilz|steinpilz|apfelkuchen|zwetschg|pflaume/.test(t)) g.seasons.push('herbst');
  if (/spargel|bärlauch|baerlauch|rhabarber|erdbeer/.test(t)) g.seasons.push('fruehling');
  if (/grill|gazpacho|wassermelone|sommer|eis\b|tomatensalat|zucchini/.test(t)) g.seasons.push('sommer');
  if (/lebkuchen|plätzchen|plaetzchen|glühwein|gluehwein|weihnacht|rotkohl|grünkohl|gruenkohl|eintopf|gulasch/.test(t)) g.seasons.push('winter');
  if (/suppe|eintopf/.test(t)) g.course = 'suppe'; else if (/salat/.test(t)) g.course = 'salat';
  else if (/kuchen|torte|brot\b|muffin|brownie|plätzchen|cookie/.test(t)) g.course = 'backen';
  else if (/dessert|pudding|mousse|tiramisu|eis\b/.test(t)) g.course = 'dessert';
  else if (/porridge|müsli|granola|pancake|frühstück|overnight/.test(t)) g.course = 'fruehstueck';
  else if (/lasagne|pasta|curry|pizza|burger|bowl|risotto|auflauf|gnocchi|chili|bolognese/.test(t)) g.course = 'haupt';
  return g;
}

      }
    };
    const applyParse = quiet => {
      const raw = $('#rIng').value; if (!raw.trim()) { if (!quiet) toast('Erst die Caption einfügen'); return; }
      const c = parseCaption(raw);
      if (!c.ingredients.length) { if (!quiet) toast('Keine Zutaten erkannt – bitte eine Zutat pro Zeile eintragen', 3500); return; }
      $('#rIng').value = c.ingredients.join('\n');
      if (c.steps && !$('#rSteps').value.trim()) { $('#rSteps').value = c.steps; $('#rSteps').closest('details').open = true; }
      if (c.servings && !$('#rServ').value) $('#rServ').value = c.servings;
      if (c.title && !$('#rTitle').value.trim()) $('#rTitle').value = c.title;
      const g = guessTags(raw);
      if (!r) { if (g.vegan) $('#rFlags [data-k=vegan]').classList.add('on'); if (g.veggie) $('#rFlags [data-k=veggie]').classList.add('on');
        g.seasons.forEach(s => $(`#rSeas [data-k=${s}]`).classList.add('on')); if (g.course && !$('#rCourse').value) $('#rCourse').value = g.course; }
      if (!quiet) toast(c.ingredients.length + ' Zutaten erkannt – bitte kurz prüfen');
    };
    $('#rCapParse').onclick = () => applyParse(false);
    $('#rShotBtn').onclick = () => $('#rShot').click();
    $('#rShotTop').onclick = () => $('#rShot').click();
    new MutationObserver(() => { const t = $('#rStatus')?.textContent || ''; if ($('#rShotTop')) $('#rShotTop').hidden = !/Screenshot\(s\) der Caption/.test(t); }).observe($('#rStatus'), {childList:true, characterData:true, subtree:true});
    $('#rShot').onchange = async e => {
      const files = [...e.target.files]; e.target.value = ''; if (!files.length) return;

        const text = await ocrImages(files, pct => { st.textContent = pct < 0 ? '⏳ Texterkennung wird vorbereitet …' : `⏳ Lese ${files.length > 1 ? files.length + ' Screenshots' : 'Screenshot'} … ${pct} %`; });
        if (!text) throw new Error('Kein Text erkannt');

        $('#rIng').value = (before && !confirm('Vorhandene Zutaten durch den erkannten Text ersetzen?\n(Abbrechen = anhängen)') ? before + '\n' : '') + text;

        $('#rStatus').textContent = '✓ Zutaten aus dem Screenshot übernommen'; $('#rIng').scrollIntoView({block:'center', behavior:'smooth'});
        applyParse(true);

        if (!img && files[0] && /instagram/.test($('#rUrl').value)) { /* Bild bleibt leer – eigenes Foto empfohlen */ }
      } catch(err) { st.textContent = '⚠️ ' + err.message; }
      finally { btn.disabled = false; }
    };
    $('#rIng').onpaste = () => setTimeout(() => { const t = $('#rIng').value; if (t.split('\n').length > 3 && /zutaten|ingredients|#|\p{Extended_Pictographic}/iu.test(t)) applyParse(false); }, 50);
    $('#rCapPaste').onclick = async () => { try { const t = await navigator.clipboard.readText(); if (!t.trim()) return toast('Zwischenablage ist leer');

      $('#rIng').value = t; applyParse(false); } catch(e) { $('#rIng').focus(); toast('Bitte lange ins Feld tippen → Einsetzen', 3500); } };
    $('#rUrl').onchange = load; $('#rUrl').onpaste = () => setTimeout(load, 50);
    $('#rUrl').onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); load(); } };
    $('#rPaste').onclick = async () => { try { const t = await navigator.clipboard.readText(); const u = (t.match(/https?:\/\/\S+/)||[])[0];
      if (u) { $('#rUrl').value = u; load(); } else toast('Kein Link in der Zwischenablage'); } catch(e) { toast('Einfügen nicht erlaubt – bitte lange tippen → Einsetzen'); } };
    $('#rImg').onchange = () => { const x = $('#rImg').value.trim(); if (x !== '(eigenes Foto)') { img = x; showImg(); } };
    $('#rPick').onclick = () => $('#rFile').click();
    $('#rFile').onchange = async e => { const f = e.target.files[0]; if (!f) return; try { img = await shrinkPhoto(f, 900, .75); $('#rImg').value = '(eigenes Foto)'; showImg(); } catch(err) { toast(err.message); } };
    $('#rOk').onclick = () => {
      const url = $('#rUrl').value.trim(), title = $('#rTitle').value.trim();
      if (!title && !url) { $('#rUrl').focus(); return toast('Bitte Link oder Überschrift angeben'); }
      const vals = { url, title: title || host(url) || 'Rezept', image: img || '', desc: $('#rDesc').value.trim(), source: v.source || host(url),
        vegan: $('#rFlags [data-k=vegan]').classList.contains('on'), veggie: $('#rFlags [data-k=veggie]').classList.contains('on') || $('#rFlags [data-k=vegan]').classList.contains('on'),
        kids: $('#rFlags [data-k=kids]').classList.contains('on'), seasons: $$('#rSeas .on').map(b=>b.dataset.k),
        course: $('#rCourse').value, time: +$('#rTime').value || 0, note: $('#rNote').value.trim(),
        ingredients: $('#rIng').value.split('\n').map(x=>x.trim()).filter(Boolean), steps: $('#rSteps').value.trim(), servings: +$('#rServ').value || 0 };
      if (vals.ingredients.length > 25 && !confirm(vals.ingredients.length + ' Zeilen als Zutaten speichern? (Tipp: „✨ Zutaten erkennen“ filtert die Caption)')) return;
      let target = r;
      if (!target) { target = {id: slug(vals.title).slice(0,30) + '-' + uid().slice(0,4), ratings:{}, cooked:0, lastCooked:null, added:now()}; data.recipes.push(target); }
      Object.assign(target, vals); touch(target);
      if (!save()) return;
      if (/cdninstagram|fbcdn/.test(vals.image)) keepImage(target);
      closeSheet(); if (!location.hash.startsWith('#/rezepte')) location.hash = '#/rezepte'; else viewRecipes();
      toast(r ? 'Gespeichert' : 'Rezept hinzugefügt');
    };
    if (preset.url) load(); else if (!r) $('#rUrl').focus();
  });
}

/* Instagram-Bildlinks laufen nach einigen Tagen ab → wenn möglich als eigenes Foto sichern */
async function keepImage(r){
  try { const res = await fetch(r.image); if (!res.ok) throw 0; r.image = await shrinkPhoto(await res.blob(), 900, .75); touch(r); save(); if (location.hash.startsWith('#/rezepte')) viewRecipes(); }
  catch(e) { toast('Tipp: Instagram-Bilder verschwinden nach ein paar Tagen – unter „Bild“ einen Screenshot als eigenes Foto hinterlegen', 5000); }
}

/* =====================================================================
   Listen als Text austauschen (z. B. von Claude im Chat erstellt → hier einfügen)
   Format:
     bring+ Liste
     # 🧀 Raclette-Abend
     Art: Einkaufsliste | Packliste | Baustein
     Personen: 4
     ## Milchprodukte
     - 800 g Raclettekäse | in Scheiben
     - 1 Pck. Raclette-Gewürz | oder Paprika & Pfeffer | fest
   ===================================================================== */
const KIND_NAMES = {list:'Einkaufsliste', pack:'Packliste', base:'Baustein'};
function listToText(l){
  const out = ['bring+ Liste', `# ${l.emoji} ${l.name}`, `Art: ${KIND_NAMES[l.kind] || 'Einkaufsliste'}`];
  if (l.servings) out.push(`Personen: ${l.servings}`);
  if (l.groups?.length) out.push(`Gruppen: ${groupsText(l)}`);
  for (const g of byCat(l.items.map(it => ({it, from: l})))) {
    out.push('', `## ${g.c.icon} ${g.c.name}`);
    for (const {it} of g.es) out.push('- ' + (it.qty ? fmtQty(it.qty, it.unit).replace(' ×', '') + ' ' : '') + it.name + (it.spec ? ' | ' + it.spec : '') + (it.grp && groupOf(l, it) ? ' | für ' + groupOf(l, it).name : '') + (it.fix ? ' | fest' : ''));
  }
  return out.join('\n');
}
async function shareListText(id){
  const t = listToText(listById(id));
  if (navigator.share && !isDesk()) { try { await navigator.share({title: listById(id).name, text: t}); return; } catch(e) { if (e.name === 'AbortError') return; } }
  try { await navigator.clipboard.writeText(t); toast('Liste als Text kopiert'); } catch(e) { prompt('Zum Kopieren:', t); }

const stripEmoji = s => String(s).replace(/^[\s\p{Extended_Pictographic}️‍]+/u, '').trim();
const leadEmoji = s => (String(s).trim().match(/^[\p{Extended_Pictographic}️‍]+/u) || [''])[0];
function parseListText(text){
  const lines = String(text).replace(/\r/g, '').split('\n').map(x => x.trim());
  const res = {name: '', emoji: '', kind: 'list', servings: 0, groups: [], items: [], newCats: []};
  let cat = null;
  for (const ln of lines) {
    if (!ln || /^bring\+?\s*liste$/i.test(ln)) continue;
    if (/^#\s/.test(ln) && !res.name) { const t = ln.slice(2).trim(); res.emoji = leadEmoji(t); res.name = stripEmoji(t); continue; }
    if (/^art\s*:/i.test(ln)) { const v = ln.split(':')[1].toLowerCase(); res.kind = /pack/.test(v) ? 'pack' : /baustein/.test(v) ? 'base' : 'list'; continue; }
    if (/^(personen|gäste|portionen)\s*:/i.test(ln)) { res.servings = parseInt(ln.split(':')[1]) || 0; continue; }
    if (/^gruppen\s*:/i.test(ln)) { res.groups = parseGroups(ln.slice(ln.indexOf(':') + 1)); continue; }
    if (/^##\s/.test(ln)) {
      const raw = ln.slice(3).trim(), nm = stripEmoji(raw), ic = leadEmoji(raw);
      const ex = data.categories.find(c => keyOf(c.name) === keyOf(nm)) || res.newCats.find(c => keyOf(c.name) === keyOf(nm));
      cat = ex || {id: slug(nm) + '-' + uid().slice(0, 3), name: nm, icon: ic || '📦', u: now()};
      if (!ex) res.newCats.push(cat);
      continue;
    }
    const body = ln.replace(/^([-–•*▪]|\d+[.)])\s+/, ''); if (!body || /^[a-zäöü ]+:\s*$/i.test(body)) continue;
    const parts = body.split(/\s*\|\s*/), fix = parts.slice(1).some(x => /^fest$/i.test(x));
    const gp = parts.slice(1).find(x => /^für\s+/i.test(x)), gk = gp ? keyOf(stripEmoji(gp.replace(/^für\s+/i, ''))) : '';
    const grp = gk ? res.groups.find(g => keyOf(g.name).startsWith(gk) || gk.startsWith(keyOf(g.name)) || keyOf(g.name).includes(gk.split(/[\s/]/)[0])) : null;
    const spec = parts.slice(1).filter(x => !/^fest$/i.test(x) && x !== gp).join(', ');
    const q = parseQtyText(parts[0]); if (!q.name) continue;
    res.items.push({id: uid(), name: q.name, spec, cat: cat?.id || guessCat(q.name), ...(q.qty ? {qty: q.qty, unit: q.unit} : {}), ...(fix ? {fix: true} : {}), ...(grp ? {grp: grp.id} : {}), u: now()});
  }
  if (res.groups.length) res.servings = res.groups.reduce((a, g) => a + g.n, 0);
  if (!res.name) res.name = 'Importierte Liste';
  return res;
}

const seasonWords = () => { const si = seasonItems(nowMonth()); return [...si.veg, ...si.fruit, ...si.herbs].map(x => keyOf(x.replace(/\s*\(.*\)$/, '')).replace(/(n|e|en|s)$/, '')).filter(x => x.length > 3); };
function seasonHits(r){
  const words = seasonWords(), text = keyOf(r.title + ' ' + r.ingredients.join(' '));
  return words.filter(w => text.includes(w)).length;
}
function smartScore(r){
  const n = Object.values(r.ratings).filter(x => x.s).length;
  let s = n ? avgRating(r) : 3.2;
  const cs = currentSeason();
  s += !r.seasons.length ? 0.3 : r.seasons.includes(cs) ? 1.2 : -1.5;
  s += Math.min(1, seasonHits(r) * 0.25);
  if (r.lastCooked) { const d = (now() - r.lastCooked) / 864e5; if (d < 10) s -= 1.2; else if (d < 30) s -= 0.4; }
  return s;
}
const fitsNow = r => r.seasons.includes(currentSeason()) || seasonHits(r) >= 2;

  const r = await fetch('https://api.anthropic.com/v1/messages', {method: 'POST',
    headers: {'x-api-key': local.ai.key, 'anthropic-version': '2023-06-01', 'content-type': 'application/json', 'anthropic-dangerous-direct-browser-access': 'true'},
    body: JSON.stringify({model: local.ai.model || 'claude-sonnet-5-5', max_tokens: maxTokens, system, messages: [{role: 'user', content: prompt}]})});
  const j = await r.json().catch(() => ({}));
  if (!r.ok) {
    const m = j?.error?.message || '';
    throw new Error(r.status === 401 ? 'API-Schlüssel ungültig' : /credit|balance|billing/i.test(m) ? 'Kein Guthaben auf dem API-Konto (console.anthropic.com → Billing)' :
      r.status === 429 ? 'Zu viele Anfragen – bitte kurz warten' : r.status === 529 || /overload/i.test(m) ? 'Claude ist gerade ausgelastet – bitte gleich nochmal' : 'Fehler ' + r.status + (m ? ': ' + m : ''));
  }
  return (j.content || []).filter(b => b.type === 'text').map(b => b.text).join('\n').trim();
}
const aiSpinner = t => `<div class="aistatus"><span class="spin"></span>${esc(t)}</div>`;
function aiListSystem(){
  return `Du erstellst Einkaufslisten und Packlisten für die deutsche App „bring+“. Antworte AUSSCHLIESSLICH mit der Liste im folgenden Textformat – ohne Einleitung, ohne Erklärung, ohne Markdown-Codeblock:

bring+ Liste
# <ein passendes Emoji> <kurzer Listenname>
Art: Einkaufsliste            (oder: Packliste / Baustein)
Personen: <Zahl>              (nur wenn eine Personenzahl genannt wurde oder sinnvoll ist)
Gruppen: 🥩 Fleisch <n>, 🌱 Vegan/Vegetarisch <m>   (nur wenn zwischen Fleischessern und Vegetariern/Veganern unterschieden werden soll; Summe = Personen)

## <Emoji> <Kategorie>
- <Menge> <Einheit> <Artikelname> | <Spezifikation> | für Fleisch | fest

Regeln:
- Artikelname kurz und so, wie man ihn im deutschen Supermarkt bzw. in der Bring!-App findet (z. B. „Paprika“, „Hafermilch“). Details wie Sorte, Marke, „bio“, „vegan“ in die Spezifikation nach „|“.
- Mengen realistisch für die angegebene Personenzahl. Einheiten nur aus: g, kg, ml, l, Pck., Dose, Glas, Flasche, Bund, Becher, Beutel, Netz, Kopf, Sack, Kasten, Rolle. Für Stückzahlen nur die Zahl (z. B. „- 3 Paprika“). Artikel ohne sinnvolle Menge ohne Zahl.
- „| fest“ bei Artikeln, die nicht mit der Personenzahl umgerechnet werden sollen (Gewürze, Saucen, Kohle, Servietten, Alufolie …).
- Bei Gruppen: gruppenspezifische Artikel mit „| für Fleisch“ bzw. „| für Vegan/Vegetarisch“ kennzeichnen; Artikel für alle ohne Gruppe. Mengen der Gruppenartikel beziehen sich auf die Gruppengröße.
- Kategorien möglichst aus dieser Liste verwenden: ${data.categories.map(c => c.icon + ' ' + c.name).join(', ')}. Eine neue Kategorie nur, wenn wirklich nötig.
- Packlisten: „Art: Packliste“, Mengen nur wo sinnvoll.
- Keine doppelten Artikel. Lieber kompakt und vollständig als ausufernd.
- Heute ist ${new Date().toLocaleDateString('de-DE', {day: 'numeric', month: 'long', year: 'numeric'})}; berücksichtige die Saison.`;
}
function cleanAiList(t){ t = String(t).replace(/^```[a-z]*\s*|```\s*$/gim, ''); const i = t.search(/bring\+?\s*liste/i); return (i >= 0 ? t.slice(i) : t).trim(); }
function aiDialog(fromListId, preset = ''){
  const fl = fromListId && listById(fromListId) && listById(fromListId).kind !== 'cart' ? listById(fromListId) : null;
  const ex = ['Grillabend für 10 Personen, 3 davon vegan', 'Kindergeburtstag mit 8 Kindern, Motto Piraten', 'Wocheneinkauf vegetarisch für 2 Erwachsene und 2 Kinder', 'Packliste Skiurlaub mit Baby', 'Frühstücksbuffet für 12 Personen'];
  openSheet(`<h2>✨ Liste mit KI erstellen</h2>
    <div class="field"><textarea id="aiPrompt" rows="4" placeholder="Was brauchst du? z. B. „Grillabend für 10 Personen, 3 davon vegan“">${esc(preset)}</textarea></div>
    <div class="schips" id="aiEx">${ex.map(x => `<button type="button">${esc(x)}</button>`).join('')}</div>
    ${fl ? `<div class="chips txt" id="aiMode" style="margin-bottom:12px"><button type="button" data-v="new" class="on">🆕 Neue Liste</button><button type="button" data-v="add">➕ Zu „${esc(fl.name)}“ ergänzen</button></div>` : ''}
    <div id="aiOut"></div>
    ${aiReady() ? `<div class="row"><button class="btn grow" onclick="closeSheet()">Abbrechen</button><button class="btn ai grow" id="aiGo">✨ Erstellen</button></div>
      <p class="muted" style="font-size:12px;margin:10px 0 0">Läuft über deinen Claude-API-Schlüssel (${esc((AI_MODELS.find(m => m[0] === (local.ai.model || 'claude-sonnet-5-5')) || AI_MODELS[0])[1].split(' –')[0])}); meist ca. 1–5 Cent pro Liste.</p>`
    : `<div class="banner" style="display:block">Für die eingebaute KI brauchst du einen eigenen Claude-API-Schlüssel (⚙️ → KI-Assistent). <b>Ohne Schlüssel:</b> Prompt kopieren, in der Claude-App einfügen, Antwort kopieren und hier importieren.</div>
      <div class="row"><button class="btn grow" id="aiCopy">📋 Prompt kopieren</button><button class="btn grow" onclick="closeSheet();setTimeout(importListDialog,60)">📥 Antwort einfügen</button></div>
      <button class="btn" style="width:100%;justify-content:center;margin-top:8px" onclick="closeSheet();location.hash='#/einstellungen'">⚙️ API-Schlüssel einrichten</button>`}`, () => {
    $('#aiEx').onclick = e => { const b = e.target.closest('button'); if (b) { $('#aiPrompt').value = b.textContent; $('#aiPrompt').focus(); } };
    $('#aiMode') && ($('#aiMode').onclick = e => { const b = e.target.closest('button'); if (b) [...$('#aiMode').children].forEach(x => x.classList.toggle('on', x === b)); });
    if (!aiReady()) { $('#aiCopy').onclick = async () => { const q = $('#aiPrompt').value.trim(); if (!q) return toast('Bitte erst beschreiben, was du brauchst');
      const t = aiListSystem() + '\n\nAufgabe: ' + q; try { await navigator.clipboard.writeText(t); toast('Prompt kopiert – jetzt in der Claude-App einfügen'); } catch(e) { prompt('Kopieren:', t); } }; return; }
    $('#aiGo').onclick = async () => {
      const q = $('#aiPrompt').value.trim(); if (!q) return $('#aiPrompt').focus();
      const mode = $('#aiMode .on')?.dataset.v || 'new';
      const ctx = mode === 'add' ? `\n\nErgänze die bestehende Liste „${fl.name}“. Sie enthält bereits: ${effItems(fl).map(itemLine).join('; ')}. Gib NUR die zusätzlichen Artikel aus (gleicher Listenname, gleiches Format).` : '';
      $('#aiGo').disabled = true; $('#aiOut').innerHTML = aiSpinner('Claude erstellt die Liste …');
      try {
        const txt = cleanAiList(await askClaude(aiListSystem(), q + ctx));
        const parsed = parseListText(txt); if (!parsed.items.length) throw new Error('Die Antwort enthielt keine Artikel – bitte anders formulieren');
        if (mode === 'add') { closeSheet(); setTimeout(() => aiAddPreview(fl.id, parsed), 60); }
        else { closeSheet(); setTimeout(() => importListDialog(txt), 60); }
      } catch(e) { $('#aiOut').innerHTML = `<div class="banner" style="background:var(--coral-soft)">⚠️ ${esc(e.message)}</div>`; $('#aiGo').disabled = false; }
    };
    $('#aiPrompt').focus();
  });
}
function aiAddPreview(lid, parsed){
  const l = listById(lid), has = it => effective(l).some(e => itemKey(e.it) === itemKey(it));
  openSheet(`<h2>✨ Vorschläge für „${esc(l.name)}“</h2>
    <div class="menu" id="apList">${parsed.items.map((it, i) => `<label><input type="checkbox" value="${i}" ${has(it) ? '' : 'checked'}>
      <span class="grow">${it.qty ? `<span class="qty">${esc(fmtQty(it.qty, it.unit))}</span> ` : ''}${esc(it.name)}${it.spec ? ` <small style="display:inline">· ${esc(it.spec)}</small>` : ''}${has(it) ? '<small>steht schon drauf</small>' : ''}</span></label>`).join('')}</div>
    <div class="row"><button class="btn grow" onclick="closeSheet()">Abbrechen</button><button class="btn primary grow" id="apOk">➕ Hinzufügen</button></div>`, () => {
    $('#apOk').onclick = () => {
      const pick = $$('#apList input:checked').map(x => parsed.items[+x.value]);
      for (const c of parsed.newCats) if (pick.some(i => i.cat === c.id)) data.categories.push(c);
      for (const it of pick) { if (it.grp && !l.groups?.some(g => g.id === it.grp)) delete it.grp; if (!has(it)) l.items.push({...it, id: uid(), u: now()}); }
      save(); closeSheet(); viewList(l); toast(pick.length + ' Artikel ergänzt');
    };
  });
}

/* KI-Rezeptideen passend zu euren Bewertungen und der Saison */
function recipeIdeas(wish = ''){
  openSheet(`<h2>✨ Neue Rezeptideen</h2>
    <p class="muted" style="margin-top:0">Vorschläge passend zu euren Bewertungen und zur Saison (${MONTHS[nowMonth()-1]}) – Gerichte, die noch nicht im Rezeptbuch stehen.</p>
    <div class="field"><input id="riWish" value="${esc(wish)}" placeholder="Wunsch (optional): z. B. schnell, für Kinder, mit Kürbis" style="border:1px solid var(--line);background:var(--card);border-radius:12px;padding:11px 12px"></div>
    <div class="schips" id="riEx">${['schnell unter 30 Min', 'kinderfreundlich', 'vegan', 'Meal-Prep', 'für Gäste'].map(x => `<button type="button">${esc(x)}</button>`).join('')}</div>
    <div id="riOut"></div>
    ${aiReady() ? `<button class="btn ai" style="width:100%;justify-content:center" id="riGo">✨ 5 Vorschläge holen</button>`
      : `<div class="banner" style="display:block">Für Rezeptideen brauchst du einen Claude-API-Schlüssel (⚙️ → KI-Assistent). Alternativ den Prompt kopieren und in der Claude-App fragen.</div>
         <button class="btn" style="width:100%;justify-content:center" id="riCopy">📋 Prompt für die Claude-App kopieren</button>`}`, () => {

      const rated = data.recipes.map(r => ({r, v: avgRating(r)})).filter(x => x.v);
      const fmt = x => `${x.r.title} (${x.v.toFixed(1)}★${x.r.vegan ? ', vegan' : x.r.veggie ? ', vegetarisch' : ''}${x.r.kids ? ', Kinder mögen es' : ''})`;
      return {sys: `Du bist ein Koch-Berater für eine Familie in Deutschland. Schlage genau 5 Gerichte vor, die NICHT schon im Rezeptbuch stehen, gut zu den hoch bewerteten Gerichten passen, schlecht bewertete Richtungen meiden und zur Jahreszeit passen (saisonale, regionale Zutaten). Antworte AUSSCHLIESSLICH mit einem JSON-Array, ohne Codeblock, ohne Text davor oder danach. Jedes Element: {"title": string, "why": string (1 Satz, warum es passt), "vegan": bool, "vegetarisch": bool, "kids": bool, "time": Minuten, "course": einer von ${COURSES.map(c => '"' + c.id + '"').join(', ')}, "seasons": Teilmenge von ["fruehling","sommer","herbst","winter"], "servings": Zahl, "ingredients": [Strings mit Menge, z. B. "400 g Kürbis"], "steps": [kurze Schritte], "search": kurzer Suchbegriff für Rezeptseiten}.`,
        user: `Monat: ${MONTHS[nowMonth()-1]}. Saisonal gerade: ${seasonItems(nowMonth()).veg.slice(0, 12).join(', ')}.
Gut bewertet: ${rated.filter(x => x.v >= 4).map(fmt).join('; ') || 'noch keine Bewertungen'}.
Weniger gemocht: ${rated.filter(x => x.v <= 2.5).map(fmt).join('; ') || '–'}.
Schon im Rezeptbuch (nicht vorschlagen): ${data.recipes.map(r => r.title).join('; ') || '–'}.
${$('#riWish').value.trim() ? 'Wunsch: ' + $('#riWish').value.trim() : ''}`};
    };
    if (!aiReady()) { $('#riCopy').onclick = async () => { const b = build(); const t = b.sys.replace(/Antworte AUSSCHLIESSLICH.*?Codeblock, ohne Text davor oder danach\.\s*Jedes Element:.*$/s, 'Gib zu jedem Gericht kurz an, warum es passt, Zeit und die Zutaten.') + '\n\n' + b.user;
      try { await navigator.clipboard.writeText(t); toast('Prompt kopiert – in der Claude-App einfügen'); } catch(e) { prompt('Kopieren:', t); } }; return; }
    $('#riGo').onclick = async () => {
      const b = build(); $('#riGo').disabled = true; $('#riOut').innerHTML = aiSpinner('Claude sucht passende Gerichte …');
      try {
        const t = await askClaude(b.sys, b.user);
        const ideas = JSON.parse(t.slice(t.indexOf('['), t.lastIndexOf(']') + 1));
        window._ideas = ideas;
        $('#riOut').innerHTML = ideas.map((x, i) => `<div class="idea"><h3>${esc(x.title)}</h3><p class="why">${esc(x.why || '')}</p>
          <div class="rmeta">${x.vegan ? '<span>🌱 vegan</span>' : x.vegetarisch ? '<span>🥕 vegetarisch</span>' : ''}${x.time ? `<span>⏱ ${timeLabel(+x.time)}</span>` : ''}${x.kids ? '<span>🧒</span>' : ''}${x.servings ? `<span>🍽 ${x.servings}</span>` : ''}</div>
          <details><summary>Zutaten & Zubereitung</summary><ul class="inglist" style="margin-top:6px">${(x.ingredients || []).map(z => `<li>${esc(z)}</li>`).join('')}</ul>${(x.steps || []).length ? `<ol>${x.steps.map(z => `<li>${esc(z)}</li>`).join('')}</ol>` : ''}</details>
          <div class="row"><button class="btn small primary" onclick="saveIdea(${i}, this)">💾 Ins Rezeptbuch</button>

            <a class="btn small" style="text-decoration:none" target="_blank" rel="noopener" href="https://www.google.com/search?q=${encodeURIComponent('Rezept ' + (x.search || x.title))}">🔎 Google</a></div></div>`).join('');

function saveIdea(i, btn){
  const x = window._ideas?.[i]; if (!x) return;
  const cs = ['fruehling','sommer','herbst','winter'];
  data.recipes.push({id: slug(x.title).slice(0, 30) + '-' + uid().slice(0, 4), url: '', title: x.title, image: '', desc: x.why || '', source: 'Idee von Claude',
    vegan: !!x.vegan, veggie: !!(x.vegetarisch || x.vegan), kids: !!x.kids, seasons: (x.seasons || []).filter(z => cs.includes(z)),
    course: COURSES.some(c => c.id === x.course) ? x.course : '', time: +x.time || 0, ratings: {}, note: '', cooked: 0, lastCooked: null, added: now(), u: now(),
    ingredients: (x.ingredients || []).map(String), steps: (x.steps || []).map((z, k) => (k + 1) + '. ' + z).join('\n'), servings: +x.servings || 0});
  save(); btn.disabled = true; btn.textContent = '✓ Gespeichert'; if (location.hash.startsWith('#/rezepte')) viewRecipes();
}

/* ---------- Teilen-Ziel (Android: „Teilen → bring+“) ---------- */
function handleShareTarget(){
  const p = new URLSearchParams(location.search);
  const txt = [p.get('url'), p.get('text'), p.get('title')].filter(Boolean).join(' ');
  if (/bring\+?\s*liste/i.test(p.get('text') || '')) { history.replaceState(null, '', location.pathname + '#/'); route(); importListDialog(p.get('text')); return; }
  const url = (txt.match(/https?:\/\/\S+/)||[])[0];
  if (!url) return;
  history.replaceState(null, '', location.pathname + '#/rezepte');
  route(); editRecipe(null, {url});
}

if (firstRun) save({noSync:true});

if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(()=>{});
