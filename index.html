<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>bring+</title>
<meta name="theme-color" content="#1a8a63">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="bring+">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
:root{
  --bg:#f5f2ea; --card:#ffffff; --ink:#1c2924; --muted:#6b7a73; --line:#e6e0d3;
  --accent:#1a8a63; --accent-ink:#ffffff; --accent-soft:#e1f2ea; --coral:#ff7a59; --coral-soft:#ffe9e2;
  --danger:#c8452f; --star:#f2a100; --side:#ece7db;
  --shadow:0 1px 2px rgba(28,41,36,.06),0 6px 18px rgba(28,41,36,.06);
  --r:16px; --tab:64px;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#121a17; --card:#1b2622; --ink:#e9efe9; --muted:#93a39b; --line:#2a3833;
    --accent:#34b886; --accent-ink:#0d1a15; --accent-soft:#1f3a2f; --coral:#ff8a6b; --coral-soft:#3a2620;
    --danger:#ff7a63; --star:#ffbf3c; --side:#17211d;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
  }
}
[hidden]{display:none!important}
/* ---------- Druckansicht ---------- */
.printdoc{background:#fff;color:#1a1a1a;border-radius:14px;box-shadow:var(--shadow);padding:28px 30px;max-width:820px;margin:6px auto 30px;font:15px/1.5 Georgia,"Iowan Old Style","Times New Roman",serif}
.printdoc h1{font:700 28px/1.2 -apple-system,"Segoe UI",Roboto,Arial,sans-serif;margin:0 0 6px;letter-spacing:-.01em}
.printdoc .pmeta{font:13px/1.5 -apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:#555;margin:0 0 14px;display:flex;flex-wrap:wrap;gap:4px 14px}
.printdoc .pimg{width:100%;max-height:300px;object-fit:cover;border-radius:10px;display:block;margin:0 0 16px}
.printdoc .pcols{display:grid;grid-template-columns:minmax(200px,1fr) 2fr;gap:28px}
@media (max-width:640px){.printdoc{padding:18px}.printdoc .pcols{grid-template-columns:1fr;gap:10px}}
.printdoc h2{font:700 13px/1 -apple-system,"Segoe UI",Roboto,Arial,sans-serif;text-transform:uppercase;letter-spacing:.08em;color:#1a8a63;margin:4px 0 10px;border-bottom:2px solid #1a8a63;padding-bottom:6px}
.printdoc ul.ping{list-style:none;padding:0;margin:0}
.printdoc ul.ping li{padding:4px 0 4px 22px;border-bottom:1px dotted #ccc;position:relative;break-inside:avoid}
.printdoc ul.ping li::before{content:"☐";position:absolute;left:0;top:3px;color:#888}
.printdoc ul.ping li.sub{padding-left:0;border:0;font-weight:700;margin-top:8px}
.printdoc ul.ping li.sub::before{content:""}
.printdoc ol.psteps{padding-left:22px;margin:0}
.printdoc ol.psteps li{margin:0 0 9px;padding-left:4px;break-inside:avoid}
.printdoc .psub{font-weight:700;margin:12px 0 6px;break-after:avoid}
.printdoc .psub:first-child{margin-top:0}
.printdoc .pnote{margin-top:16px;padding:10px 12px;border-left:3px solid #1a8a63;background:#f4f8f6;font-size:14px}
.printdoc .pfoot{margin-top:20px;padding-top:8px;border-top:1px solid #ddd;font:11px/1.4 -apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:#777;word-break:break-all}
.printdoc .pmissing{font:14px/1.5 -apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:#7a5a00;background:#fff6dc;border-radius:8px;padding:10px 12px}
.printopts{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:4px 0 10px;font-size:14px;color:var(--muted)}
.printopts label{display:flex;gap:6px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 12px;cursor:pointer}
.printdoc.noimg .pimg{display:none}
.printdoc.big{font-size:17px}
@media print{
  @page{margin:14mm 14mm 16mm}
  body{padding:0!important;background:#fff!important}
  header.top,aside.side,nav.tabs,#fabslot,#selslot,.toast,.scrim,.sheet,.noprint{display:none!important}
  main.wrap{max-width:none;padding:0}
  .printdoc{box-shadow:none;border-radius:0;padding:0;margin:0;max-width:none}
  .printdoc .pimg{max-height:75mm}
  .printdoc a{color:inherit;text-decoration:none}
  .printdoc h2{break-after:avoid}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;min-height:100vh;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) calc(env(safe-area-inset-bottom) + var(--tab) + 90px) env(safe-area-inset-left)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}

/* ---------- Kopf ---------- */
header.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
header.top .wrap{display:flex;align-items:center;gap:6px;height:60px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:22px;letter-spacing:-.02em;white-space:nowrap}
.brand img{width:34px;height:34px;border-radius:9px}
.brand b{color:var(--coral)}
.htitle{font-weight:750;font-size:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spacer{flex:1}
.iconbtn{width:42px;height:42px;border-radius:12px;border:0;background:transparent;display:grid;place-items:center;font-size:20px;flex:none;position:relative}
.iconbtn:hover{background:var(--line)}
.iconbtn .badge{position:absolute;right:6px;top:6px;width:9px;height:9px;border-radius:50%;background:var(--muted)}
.iconbtn .badge.ok{background:var(--accent)} .iconbtn .badge.err{background:var(--danger)} .iconbtn .badge.busy{background:var(--star);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.3}}
.title-edit{font-weight:750;font-size:20px;border:0;background:transparent;padding:6px 4px;min-width:0;flex:1;border-radius:8px}
.title-edit:focus{outline:2px solid var(--accent);background:var(--card)}

/* ---------- Unterer Tab-Balken (Handy) ---------- */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:8;display:flex;background:var(--card);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);height:calc(var(--tab) + env(safe-area-inset-bottom))}
nav.tabs button{flex:1;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;color:var(--muted);font-weight:600}
nav.tabs button span{font-size:22px;line-height:1}
nav.tabs button.on{color:var(--accent)}

/* ---------- Seitenleiste (PC) ---------- */
aside.side{display:none}
@media (min-width: 960px){
  body{padding:0 0 40px 280px;--tab:0px}
  nav.tabs{display:none}
  aside.side{display:flex;flex-direction:column;position:fixed;left:0;top:0;bottom:0;width:280px;background:var(--side);border-right:1px solid var(--line);padding:16px 12px;overflow:auto;z-index:9}
  aside.side .brand{padding:4px 8px 14px}
  .wrap{max-width:980px;padding:0 28px}
  header.top .wrap{height:68px}
}
.sgroup{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:16px 10px 6px;font-weight:700}
.slink{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;padding:8px 10px;border-radius:10px;text-align:left;font-weight:600}
.slink:hover{background:color-mix(in srgb,var(--line) 70%,transparent)}
.slink.on{background:var(--card);box-shadow:var(--shadow)}
.slink .e{width:24px;text-align:center;font-size:18px}
.slink .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slink .k{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:0 5px;font-weight:600}
.slink .c{font-size:12px;color:var(--muted);font-weight:500}
.slink.drop{outline:2px dashed var(--accent);background:var(--accent-soft)}
.sfoot{margin-top:auto;padding-top:14px;font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:4px;padding-left:10px}

/* ---------- Startseite ---------- */
.hint{color:var(--muted);font-size:14px;margin:6px 2px 14px}
.lists{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.lcard{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;text-align:left;border:0;display:flex;flex-direction:column;gap:6px;min-height:118px}
.lcard:hover{outline:2px solid var(--accent-soft)}
.lcard .emo{font-size:30px;line-height:1}
.lcard .nm{font-weight:700;font-size:16px}
.lcard .ct{color:var(--muted);font-size:13px}
.lcard.base{background:transparent;box-shadow:none;border:2px solid var(--line)}
.lcard.add{border:2px dashed var(--line);background:transparent;box-shadow:none;align-items:center;justify-content:center;color:var(--muted);font-weight:600}
.sec{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:22px 4px 8px;font-weight:700}

/* ---------- Liste ---------- */
.actions{display:flex;gap:8px;margin:4px 0 12px;flex-wrap:wrap}
.btn{border:0;border-radius:12px;padding:11px 15px;font-weight:650;background:var(--card);box-shadow:var(--shadow);display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.grow{flex:1;justify-content:center}
.btn.danger{color:var(--danger)}
.btn.small{padding:7px 11px;font-size:14px}
.btn:active{transform:scale(.98)}
.btn kbd,.kbd{font:600 11px/1 ui-monospace,Menlo,monospace;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:2px 5px;color:var(--muted);background:var(--bg)}
.btn.primary kbd{background:transparent;color:inherit;border-color:rgba(255,255,255,.4)}
.incl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:0 0 6px;font-size:14px;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 10px;font-size:14px;font-weight:600;color:var(--ink)}
.chip button{border:0;background:transparent;padding:0;color:var(--muted);font-size:14px}
.chip.add{border-style:dashed;color:var(--muted);cursor:pointer}
.cat{margin:16px 0 6px}
.cat h3{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 4px 8px;display:flex;gap:6px;align-items:center}
.items{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.item{display:flex;align-items:center;gap:12px;padding:10px 14px;border-top:1px solid var(--line);position:relative;cursor:pointer;user-select:none}
.item:first-child{border-top:0}
.item:hover{background:color-mix(in srgb,var(--accent-soft) 45%,transparent)}
.item.cur{box-shadow:inset 3px 0 0 var(--accent);background:color-mix(in srgb,var(--accent-soft) 60%,transparent)}
.item.sel{background:var(--accent-soft)}
.item .cb{width:22px;height:22px;border-radius:7px;border:2px solid var(--line);flex:none;display:grid;place-items:center;font-size:14px;color:var(--accent-ink);background:var(--card)}
.item.sel .cb{background:var(--accent);border-color:var(--accent)}
.item .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);flex:none}
.item.inh .dot{background:transparent;border:2px solid var(--muted)}
.item .txt{flex:1;min-width:0}
.item .n{font-weight:600}
.item .s{color:var(--muted);font-size:14px}
.item .from{font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:1px 8px;white-space:nowrap}
.item .thumb{width:44px;height:44px;border-radius:10px;object-fit:cover;flex:none;background:var(--line)}
.item .ia{display:flex;gap:2px;opacity:.0;transition:opacity .1s}
.item:hover .ia,.item.cur .ia{opacity:1}
.item .ia button{border:0;background:transparent;border-radius:8px;width:32px;height:32px;font-size:16px;color:var(--muted)}
.item .ia button:hover{background:var(--line);color:var(--ink)}
@media (hover:none){.item .ia{display:none}}
@media (max-width:959px){body:not(.selmode) .item .cb{display:none}}
@media (hover:none){.btn kbd,.selbar kbd,.btn .kbd{display:none}}
.item .pcb{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center;font-size:15px;color:#fff;background:var(--card)}
.item.packed .pcb{background:var(--accent);border-color:var(--accent)}
.item.packed .n{text-decoration:line-through;color:var(--muted)}
.item.packed .thumb{opacity:.5}
.item.pk .ia{opacity:1}
@media (hover:none){.item.pk .ia{display:flex}.item.pk .ia [data-act=copy],.item.pk .ia [data-act=del]{display:none}}
.progress{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin:2px 0 14px}
.progress span{display:block;height:100%;background:var(--accent);transition:width .2s}
.inglist{margin:0 0 14px;padding:10px 12px 10px 30px;background:var(--card);border-radius:12px;box-shadow:var(--shadow)}
.inglist li{padding:2px 0}
.steps-text{white-space:pre-wrap;background:var(--card);border-radius:12px;padding:10px 12px;box-shadow:var(--shadow);margin:0 0 14px;font-size:15px}
.empty{text-align:center;color:var(--muted);padding:40px 10px}
.stale{background:#fff3d6;color:#6a4a00;border-radius:12px;padding:10px 12px;font-size:14px;margin:0 0 12px}
@media (prefers-color-scheme: dark){.stale{background:#3a3016;color:#f4dc9a}}
details.hidden-items{margin-top:18px;color:var(--muted)}
details.hidden-items summary{cursor:pointer;font-size:14px;margin:0 4px 8px}
.kbdhint{color:var(--muted);font-size:13px;margin:18px 4px;display:none;gap:14px;flex-wrap:wrap}
@media (min-width:960px) and (hover:hover){.kbdhint{display:flex}}

/* Auswahl-Leiste */
.selbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tab) + 16px + env(safe-area-inset-bottom));z-index:12;
  background:var(--ink);color:var(--bg);border-radius:16px;padding:8px;display:flex;gap:6px;align-items:center;box-shadow:0 10px 30px rgba(0,0,0,.25);max-width:calc(100vw - 24px);overflow-x:auto}
.selbar .cnt{padding:0 10px;font-weight:700;white-space:nowrap}
.selbar button{border:0;border-radius:10px;padding:9px 12px;background:color-mix(in srgb,var(--bg) 14%,transparent);color:var(--bg);font-weight:650;white-space:nowrap;display:flex;gap:6px;align-items:center}
.selbar button:hover{background:color-mix(in srgb,var(--bg) 26%,transparent)}
.selbar kbd{font:600 11px/1 ui-monospace,monospace;border:1px solid color-mix(in srgb,var(--bg) 40%,transparent);border-radius:4px;padding:2px 4px;opacity:.8}
@media (min-width:960px){.selbar{left:calc(50% + 140px)}}

.fab{position:fixed;right:max(18px,env(safe-area-inset-right));bottom:calc(var(--tab) + 18px + env(safe-area-inset-bottom));width:60px;height:60px;border-radius:20px;border:0;background:var(--coral);color:#fff;font-size:32px;font-weight:300;box-shadow:0 8px 24px rgba(255,122,89,.45);z-index:6}
@media (min-width:960px){.fab{right:32px;bottom:28px}}

/* ---------- Rezepte ---------- */
.rtools{display:flex;gap:8px;margin:4px 0 10px}
.search{flex:1;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:11px 12px;min-width:0}
.search:focus{outline:2px solid var(--accent);border-color:transparent}
.filters{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none;flex-wrap:nowrap}
.filters::-webkit-scrollbar{display:none}
@media (min-width:960px){.filters{flex-wrap:wrap}}
.fchip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 12px;font-size:14px;font-weight:600;white-space:nowrap;flex:none}
.fchip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.fchip.now:not(.on){border-color:var(--accent);color:var(--accent)}
select.fchip{appearance:none;-webkit-appearance:none;padding-right:26px;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 14px) 52%,calc(100% - 9px) 52%;background-size:5px 5px;background-repeat:no-repeat}
select.fchip.on{background-image:linear-gradient(45deg,transparent 50%,var(--accent-ink) 50%),linear-gradient(135deg,var(--accent-ink) 50%,transparent 50%)}
.rcount{color:var(--muted);font-size:14px;margin:4px 2px 10px;display:flex;justify-content:space-between;gap:8px}
.rcount button{border:0;background:transparent;color:var(--accent);font-weight:600;font-size:14px;padding:0}
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
@media (min-width:600px){.rgrid{grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}}
.rcard{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;border:0;padding:0;text-align:left;display:flex;flex-direction:column}
.rcard:hover{outline:2px solid var(--accent-soft)}
.rimg{aspect-ratio:4/3;width:100%;object-fit:cover;background:linear-gradient(135deg,var(--accent-soft),var(--coral-soft));display:block}
.rph{aspect-ratio:4/3;width:100%;display:grid;place-items:center;font-size:44px;background:linear-gradient(135deg,var(--accent-soft),var(--coral-soft))}
.rbody{padding:10px 12px 12px;display:flex;flex-direction:column;gap:5px;flex:1}
.rtitle{font-weight:700;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rmeta{display:flex;flex-wrap:wrap;gap:4px 8px;font-size:13px;color:var(--muted);align-items:center}
.rsrc{font-size:12px;color:var(--muted);margin-top:auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stars{color:var(--star);letter-spacing:1px;white-space:nowrap}
.stars .off{color:var(--line)}
.rate{display:flex;gap:2px}
.rate button{border:0;background:transparent;font-size:30px;line-height:1;padding:2px;color:var(--line)}
.rate button.on{color:var(--star)}
.ratings{display:flex;flex-direction:column;gap:6px;margin:6px 0 14px}
.ratings .who{display:flex;align-items:center;gap:10px}
.ratings .who b{min-width:70px}
.dimg{width:100%;max-height:300px;object-fit:cover;border-radius:14px;display:block;background:var(--line);margin-bottom:12px}
.tagrow{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
.tag{font-size:13px;border-radius:999px;padding:4px 10px;background:var(--accent-soft);color:var(--ink);font-weight:600}

/* ---------- Sheet / Dialog ---------- */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:20;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--bg);border-radius:22px 22px 0 0;max-height:90vh;overflow:auto;
  transform:translateY(105%);transition:transform .25s ease;padding:8px 0 calc(20px + env(safe-area-inset-bottom))}
.sheet.on{transform:none}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 12px}
@media (min-width:960px){
  .sheet{left:50%;right:auto;bottom:auto;top:50%;width:min(620px,92vw);max-height:88vh;border-radius:20px;opacity:0;pointer-events:none;
    transform:translate(-50%,-46%);transition:transform .18s ease,opacity .18s;padding:18px 0 20px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
  .sheet.on{transform:translate(-50%,-50%);opacity:1;pointer-events:auto}
  .sheet .grab{display:none}
  .sheet .wrap{padding:0 24px}
}
.sheet h2{font-size:19px;margin:0 0 14px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label,.flabel{font-size:13px;color:var(--muted);font-weight:600}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:11px 12px;width:100%}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--accent);border-color:transparent}
.row{display:flex;gap:8px}
.row > .field{flex:1}
.menu{display:flex;flex-direction:column;background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;margin-bottom:14px}
.menu > button,.menu > label{border:0;border-top:1px solid var(--line);background:transparent;text-align:left;padding:13px 16px;display:flex;gap:12px;align-items:center;cursor:pointer}
.menu > :first-child{border-top:0}
.menu > button:hover,.menu > label:hover{background:color-mix(in srgb,var(--accent-soft) 50%,transparent)}
.menu button.danger{color:var(--danger)}
.menu small{display:block;color:var(--muted);font-size:13px}
.menu .grow{flex:1}
.menu input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent);flex:none}
.catrow{display:flex;gap:8px;align-items:center;padding:8px 10px;border-top:1px solid var(--line)}
.catrow:first-child{border-top:0}
.catrow input{flex:1;border:1px solid transparent;background:transparent;border-radius:8px;padding:8px;min-width:0}
.catrow input.ic{flex:0 0 48px;text-align:center}
.catrow input:focus{border-color:var(--accent);background:var(--bg);outline:0}
.catrow .iconbtn{width:34px;height:34px;font-size:16px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 10px;font-size:20px}
.chips.txt button{font-size:14px;font-weight:600;padding:7px 12px}
.chips button.on{border-color:var(--accent);background:var(--accent-soft)}
.toast{position:fixed;left:50%;bottom:calc(var(--tab) + 96px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);
  padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;transition:all .2s;z-index:40;max-width:90vw;text-align:center;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%)}
@media (min-width:960px){.toast{left:calc(50% + 140px);bottom:40px}}
.banner{background:var(--accent-soft);border-radius:12px;padding:12px;margin:0 0 14px;font-size:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.muted{color:var(--muted);font-size:14px}
code{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:1px 5px;font-size:13px;word-break:break-all}
.photoBox img{display:block;width:100%;max-height:240px;object-fit:cover;border-radius:12px;margin-bottom:8px;background:var(--line)}
.viewer{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.92);display:none;flex-direction:column;align-items:center;justify-content:center;padding:20px;gap:12px}
.viewer.on{display:flex}
.viewer img{max-width:100%;max-height:80vh;border-radius:12px}
.viewer div{color:#fff;font-weight:600;text-align:center}
.keys{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;align-items:center;font-size:15px;margin-bottom:16px}
.keys .kbd{font-size:12px;justify-self:start}
ol.steps{padding-left:20px;margin:6px 0 14px} ol.steps li{margin:4px 0}
</style>

/* Effektive Artikel einer Liste: eigene + eingebundene Bausteine (rekursiv), ohne ausgeblendete, ohne Dubletten */
function effective(l, seen = new Set()){
  if (seen.has(l.id)) return [];
  seen.add(l.id);
  const out = l.items.map(it => ({it, from:l}));
  for (const bid of l.includes) {
    const b = listById(bid); if (!b) continue;
    for (const e of effective(b, seen)) if (!l.excludes.includes(e.it.id)) out.push(e);
  }
  const keys = new Set(), res = [];
  for (const e of out) { const k = itemKey(e.it); if (!keys.has(k)) { keys.add(k); res.push(e); } }
  return res;
}
function hiddenInherited(l){
  const out = [];
  for (const bid of l.includes) { const b = listById(bid); if (!b) continue;
    for (const e of effective(b, new Set([l.id]))) if (l.excludes.includes(e.it.id)) out.push(e); }
  return out;
}
function byCat(entries){
  const order = data.categories.map(c=>c.id);
  const groups = data.categories.map(c => ({c, es: entries.filter(e=>e.it.cat===c.id)})).filter(g=>g.es.length);
  const rest = entries.filter(e=>!order.includes(e.it.cat));
  if (rest.length) groups.push({c:{id:'', icon:'📦', name:'Ohne Kategorie'}, es:rest});
  return groups;
}
const effItems = l => byCat(effective(l)).flatMap(g=>g.es.map(e=>e.it));
const usedBy = id => data.lists.filter(l=>l.includes.includes(id));

/* ---------- Zusammenführen (Handy ↔ PC ↔ Server) ---------- */
function mergeData(A, B){
  A = normalize(JSON.parse(JSON.stringify(A))); B = normalize(JSON.parse(JSON.stringify(B)));
  const del = {...A.deleted};
  for (const [k,v] of Object.entries(B.deleted)) del[k] = Math.max(del[k]||0, v);
  const alive = (k, u) => !(del[k] >= u);
  const newer = (a, b) => (b.u > a.u ? b : a);
  function byId(xa, xb, kind, combine){
    const m = new Map(); const order = [];
    for (const x of xa) { m.set(x.id, x); order.push(x.id); }
    for (const x of xb) { if (m.has(x.id)) m.set(x.id, combine(m.get(x.id), x)); else { m.set(x.id, x); order.push(x.id); } }
    return order.map(id => m.get(id)).filter(x => alive(kind+':'+x.id, x.u));
  }
  const orderBy = (arr, winner) => { const ids = winner.map(x=>x.id); return [...arr].sort((a,b)=>{
    const ia = ids.indexOf(a.id), ib = ids.indexOf(b.id); return (ia<0?1e9:ia) - (ib<0?1e9:ib); }); };
  const out = {app:'bring+', version:2, deleted:del,
    updatedAt: Math.max(A.updatedAt, B.updatedAt),
    listOrderU: Math.max(A.listOrderU, B.listOrderU), catOrderU: Math.max(A.catOrderU, B.catOrderU)};
  out.categories = orderBy(byId(A.categories, B.categories, 'cat', newer), B.catOrderU > A.catOrderU ? B.categories : A.categories);
  out.lists = orderBy(byId(A.lists, B.lists, 'list', (a,b) => ({...newer(a,b), items: byId(a.items, b.items, 'item', newer)})),
    B.listOrderU > A.listOrderU ? B.lists : A.lists);
  for (const l of out.lists) l.items = l.items.filter(it => alive('item:'+it.id, it.u));
  out.recipes = byId(A.recipes, B.recipes, 'recipe', (a,b) => {
    const r = {...newer(a,b)}, rt = {...a.ratings};
    for (const [k,v] of Object.entries(b.ratings)) if (!rt[k] || v.u > rt[k].u) rt[k] = v;
    r.ratings = rt; return r;
  });
  // alte Tombstones (> 120 Tage) aufräumen
  const cut = now() - 120*864e5; for (const k of Object.keys(out.deleted)) if (out.deleted[k] < cut) delete out.deleted[k];
  return out;
}
const sortKeys = v => Array.isArray(v) ? v.map(sortKeys) : v && typeof v === 'object' ? Object.fromEntries(Object.keys(v).sort().map(k => [k, sortKeys(v[k])])) : v;
const canon = d => JSON.stringify(sortKeys({...d, updatedAt:0}));
const sameData = (a, b) => canon(normalize(JSON.parse(JSON.stringify(a)))) === canon(normalize(JSON.parse(JSON.stringify(b))));
const dataText = d => JSON.stringify(sortKeys(d), null, 1);
async function gitSha(text){
  try { const b = new TextEncoder().encode(text), h = new TextEncoder().encode('blob ' + b.length + '\0');
    const all = new Uint8Array(h.length + b.length); all.set(h); all.set(b, h.length);
    return [...new Uint8Array(await crypto.subtle.digest('SHA-1', all))].map(x=>x.toString(16).padStart(2,'0')).join(''); }
  catch(e) { return null; }
}

async function openBringPage(url, want, onProblem){
  try {
    const r = await fetch(url + '?ts=' + now(), {cache:'no-store'});
    if (!r.ok) return onProblem('missing');
    const online = await r.text();
    const m = online.match(/"recipeIngredient":(\[[^\]]*\])/);
    const have = m ? JSON.parse(m[1]) : null;
    if (!online.includes('"image"')) return onProblem('old');
    if (!have || JSON.stringify(have) !== JSON.stringify(want)) {
      const msg = ghReady()
        ? 'GitHub aktualisiert die Bring-Seite gerade noch (dauert 1–2 Minuten nach dem Sync). Bring würde jetzt den alten Stand (' + (have?have.length:0) + ' Artikel) laden.\n\nTrotzdem öffnen?'
        : 'Online liegt ein älterer Stand dieser Liste (' + (have?have.length:0) + ' statt ' + want.length + ' Artikel).\n\nTrotzdem öffnen? (Sonst: Sync einrichten oder Paket hochladen)';
      if (!confirm(msg)) { if (ghReady()) syncNow(); return; }
    }
  } catch(e) { /* offline / lokal geöffnet – trotzdem versuchen */ }
  location.href = BRING_DEEPLINK + encodeURIComponent(url) + '&baseQuantity=1&requestedQuantity=1';
}

const iso2min = t => { const m = String(t||'').match(/P(?:\d+D)?T?(?:(\d+)H)?(?:(\d+)M)?/i); return m ? (+m[1]||0)*60 + (+m[2]||0) : 0; };
const _tx = document.createElement('textarea');
const clean = t => { _tx.innerHTML = String(t||'').replace(/<[^>]+>/g, ' '); return _tx.value.replace(/\s+/g,' ').trim(); };
function findRecipeLd(objs){
  const q = [...objs];
  while (q.length) {
    const o = q.shift(); if (!o || typeof o !== 'object') continue;
    if (Array.isArray(o)) { q.push(...o); continue; }
    const t = [].concat(o['@type'] || []);
    if (t.includes('Recipe')) return o;
    if (o['@graph']) q.push(...[].concat(o['@graph']));
    if (o.mainEntity) q.push(o.mainEntity);
  }
  return null;
}
function stepsFromLd(ins){
  const out = [];
  const walk = x => {
    if (!x) return;
    if (typeof x === 'string') { x.split(/\n|<br\s*\/?>/i).map(clean).filter(Boolean).forEach(y => out.push(y)); return; }
    if (Array.isArray(x)) return x.forEach(walk);
    if (x['@type'] === 'HowToSection' || x.itemListElement) { if (x.name) out.push('## ' + clean(x.name)); return walk(x.itemListElement); }
    walk(x.text || x.name);
  };
  walk(ins); return out.filter(Boolean);
}
async function fetchRecipeContent(url){
  const rule = (n, sel, attr, all=true) => `&data.${n}.${all?'selectorAll':'selector'}=${encodeURIComponent(sel)}&data.${n}.attr=${attr}`;
  const r = await fetch(PREVIEW_API + encodeURIComponent(url) + '&meta=false'
    + rule('ld', 'script[type="application/ld+json"]', 'html')
    + rule('wing', '.wprm-recipe-ingredient, .tasty-recipes-ingredients li, .recipe-ingredients li, [itemprop="recipeIngredient"]', 'text')
    + rule('wstep', '.wprm-recipe-instruction-text, .tasty-recipes-instructions li, .recipe-instructions li, [itemprop="recipeInstructions"] li', 'text'));
  if (!r.ok) throw new Error('Rezept konnte nicht geladen werden');
  const j = await r.json(); if (j.status !== 'success') throw new Error('Rezept konnte nicht geladen werden');
  const d = j.data || {}, lds = [];
  for (const raw of [].concat(d.ld || [])) { try { lds.push(JSON.parse(String(raw).trim())); } catch(e) {} }
  const ld = findRecipeLd(lds);
  const res = {ingredients: [], steps: [], servings: 0, time: 0, image: '', desc: ''};
  if (ld) {
    res.ingredients = [].concat(ld.recipeIngredient || ld.ingredients || []).map(clean).filter(Boolean);
    res.steps = stepsFromLd(ld.recipeInstructions);
    res.servings = parseInt([].concat(ld.recipeYield || [])[0]) || 0;
    res.time = iso2min(ld.totalTime) || (iso2min(ld.prepTime) + iso2min(ld.cookTime));
    const im = [].concat(ld.image || [])[0]; res.image = typeof im === 'string' ? im : im?.url || '';
    res.desc = clean(ld.description).slice(0, 300);
  }
  if (!res.ingredients.length) res.ingredients = [].concat(d.wing || []).map(clean).filter(Boolean);
  if (!res.steps.length) res.steps = [].concat(d.wstep || []).map(clean).filter(Boolean);
  if (!res.ingredients.length && !res.steps.length) throw new Error('Keine Rezeptdaten auf der Seite gefunden');
  return res;
}

/* Instagram-Caption & Co.: Zutaten, Zubereitung, Portionen und Titel erkennen */
function parseCaption(text){
  const raw = String(text || '').replace(/\r/g, '').split('\n');
  const strip = s => s.replace(/^[\s\p{Extended_Pictographic}\uFE0F\u200d•·▪◦‣⁃*✓✔►▶→➡>_~\-–—]+/u, '').replace(/[\s\uFE0F]+$/u, '').trim();
  const lines = raw.map(l => ({orig: l.trim(), t: strip(l)}));
  const head = /^(zutaten|ingredients|du brauchst|was du brauchst|das brauchst du|einkaufsliste)\b/i;
  const stop = /^(zubereitung|so geht'?s|und so geht'?s|anleitung|instructions|method|directions|schritte|steps|so wird'?s gemacht|los geht'?s)\b/i;
  const qty = /^((\d+([.,/]\d+)?|[½¼¾⅓⅔⅛])\s*(-\s*\d+\s*)?(g|kg|ml|l|el|tl|stk|stück|pck|päckchen|prise|dose|bund|zehe|zehen|cups?|tbsp|tsp|oz|scheiben?|handvoll)?\b|(eine?n?|zwei|drei|vier|fünf|etwas|prise|handvoll|ein paar|ein schuss|1\/2)\s)/i;
  const servingsM = String(text).match(/(?:für|for|ergibt|reicht für)?\s*(\d{1,2})\s*(portionen|portion|personen|servings|stück)/i);
  let ing = [], steps = [], mode = 'pre', found = false;
  for (const {orig, t} of lines) {
    if (!t) continue;
    if (/^#\w/.test(orig) && !/^#\d/.test(orig)) { if (mode !== 'pre') mode = 'end'; continue; }
    if (head.test(t)) { found = true; mode = 'ing';
      const rest = t.replace(head, '').replace(/^[^:]*:\s*/, '').replace(/^\(.*?\)\s*:?\s*/, '');
      if (rest && rest.length > 2 && !/^für\s/i.test(rest)) rest.split(/\s*[,;]\s*/).forEach(x => x && ing.push(x));
      continue; }
    if (stop.test(t)) { mode = 'steps'; const rest = t.replace(stop, '').replace(/^[:\s]+/, ''); if (rest) steps.push(rest); continue; }
    if (mode === 'ing') { if (/:$/.test(t) && t.length < 40) continue; ing.push(t.replace(/^\d+[.)]\s+(?=\D)/, '')); }
    else if (mode === 'steps') steps.push(orig.replace(/^[\s\uFE0F]+/, ''));
  }
  if (!found) {        // ohne Überschrift: Zeilen mit Mengenangabe sammeln
    ing = lines.filter(({t}) => t && t.length < 70 && qty.test(t) && !/^\d+[.)]\s/.test(t)).map(({t}) => t);
  }
  const first = lines.find(({t}) => t && !head.test(t) && !/^#/.test(t) && !qty.test(t));
  const title = first ? first.t.replace(/[\s\p{Extended_Pictographic}\uFE0F\u200d:!.]+$/u, '').slice(0, 80) : '';
  return {ingredients: [...new Set(ing.map(x => x.replace(/\s+/g, ' ').trim()).filter(x => x.length > 1))],
    steps: steps.join('\n').trim(), servings: servingsM ? +servingsM[1] : 0, title};
}

function shrinkPhoto(file, max = 640, q = 0.72){
  return new Promise((res, rej) => {
    const img = new Image(), u = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement('canvas');
      c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
      const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0,0,c.width,c.height);
      g.drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(u);
      res(c.toDataURL('image/jpeg', q));
    };
    img.onerror = () => { URL.revokeObjectURL(u); rej(new Error('Bild konnte nicht gelesen werden')); };
    img.src = u;
  });
}
function dataUrlBytes(d){ const b = atob(d.split(',')[1]), a = new Uint8Array(b.length); for (let i=0;i<b.length;i++) a[i] = b.charCodeAt(i); return a; }

/* ---------- ZIP (unkomprimiert, ohne Bibliothek) ---------- */
const CRC = (()=>{ const t=new Uint32Array(256); for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0;} return t; })();
const crc32 = b => { let c=0xFFFFFFFF; for (let i=0;i<b.length;i++) c=CRC[(c^b[i])&255]^(c>>>8); return (c^0xFFFFFFFF)>>>0; };
function makeZip(files){
  const enc = new TextEncoder(), parts = [], central = []; let off = 0;
  for (const f of files){
    const name = enc.encode(f.name), body = f.bytes || enc.encode(f.text), crc = crc32(body);
    const h = new DataView(new ArrayBuffer(30));
    h.setUint32(0,0x04034b50,true); h.setUint16(4,20,true); h.setUint16(6,0x0800,true); h.setUint16(8,0,true);
    h.setUint16(10,0,true); h.setUint16(12,0x21,true); h.setUint32(14,crc,true);
    h.setUint32(18,body.length,true); h.setUint32(22,body.length,true); h.setUint16(26,name.length,true); h.setUint16(28,0,true);
    parts.push(h, name, body);
    const c = new DataView(new ArrayBuffer(46));
    c.setUint32(0,0x02014b50,true); c.setUint16(4,20,true); c.setUint16(6,20,true); c.setUint16(8,0x0800,true);
    c.setUint16(10,0,true); c.setUint16(12,0,true); c.setUint16(14,0x21,true); c.setUint32(16,crc,true);
    c.setUint32(20,body.length,true); c.setUint32(24,body.length,true); c.setUint16(28,name.length,true);
    c.setUint32(42,off,true);
    central.push(c, name);
    off += 30 + name.length + body.length;
  }
  const csize = central.reduce((s,p)=>s+p.byteLength,0);
  const e = new DataView(new ArrayBuffer(22));
  e.setUint32(0,0x06054b50,true); e.setUint16(8,files.length,true); e.setUint16(10,files.length,true);
  e.setUint32(12,csize,true); e.setUint32(16,off,true);
  return new Blob([...parts, ...central, e], {type:'application/zip'});
}
function download(blob, name){
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();}, 500);
}

/* =====================================================================
   GitHub-Sync: daten.json, Bring-Seiten und Fotos direkt ins Repository
   ===================================================================== */
const sync = {state: local.gh.token ? 'idle' : 'off', msg: '', busy: false, again: false, timer: null};
function ghCfg(){
  const g = local.gh; let owner = g.owner, repo = g.repo;
  if (!owner || !repo) {
    const m = (location.hostname.match(/^([^.]+)\.github\.io$/));
    const seg = location.pathname.split('/').filter(Boolean)[0];
    if (m && seg) { owner = owner || m[1]; repo = repo || seg; }
    else { const d = DEFAULT_BASE.match(/^https:\/\/([^.]+)\.github\.io\/([^/]+)\//); owner = owner || d[1]; repo = repo || d[2]; }
  }
  return {owner, repo, branch: g.branch || 'main', token: g.token || ''};
}
const ghReady = () => !!local.gh.token;
async function gh(path, opts = {}){
  const c = ghCfg();
  const r = await fetch(`https://api.github.com/repos/${c.owner}/${c.repo}${path ? '/' + path : ''}`, {
    ...opts, cache:'no-store',
    headers: {'Accept':'application/vnd.github+json', 'Authorization':'Bearer '+c.token, 'X-GitHub-Api-Version':'2022-11-28', ...(opts.headers||{})}
  });
  if (r.status === 404) return null;
  if (!r.ok) { const t = await r.text().catch(()=>''); const e = new Error(r.status + ' ' + t.slice(0,140)); e.status = r.status; throw e; }
  return r.status === 204 ? {} : r.json();
}
const b64utf8 = s => { const b = new TextEncoder().encode(s); let x = ''; for (let i=0;i<b.length;i+=0x8000) x += String.fromCharCode(...b.subarray(i,i+0x8000)); return btoa(x); };
const utf8b64 = s => new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\s/g,'')), c=>c.charCodeAt(0)));
async function ghGet(path){ const c = ghCfg(); const r = await gh(`contents/${path}?ref=${c.branch}&t=${now()}`); return r && !Array.isArray(r) ? {sha:r.sha, text: r.content ? utf8b64(r.content) : null} : null; }
async function ghDir(path){ const c = ghCfg(); const r = await gh(`contents/${path}?ref=${c.branch}&t=${now()}`); const m = {}; if (Array.isArray(r)) for (const f of r) m[f.name] = f.sha; return m; }
async function ghPut(path, b64, sha, msg){
  const c = ghCfg();
  return gh(`contents/${path}`, {method:'PUT', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({message: msg || ('bring+: ' + path), content: b64, branch: c.branch, ...(sha ? {sha} : {})})});
}
function setSync(state, msg){ sync.state = state; sync.msg = msg || ''; renderSyncBadge(); if (location.hash === '#/einstellungen' && !document.activeElement?.matches('input')) viewSettings(); }
function scheduleSync(){ if (!ghReady() || local.gh.auto === false) return; clearTimeout(sync.timer); sync.timer = setTimeout(syncNow, 2500); }

async function syncNow(manual){
  if (!ghReady()) { if (manual) { location.hash = '#/einstellungen'; toast('Bitte zuerst den GitHub-Sync einrichten'); } return; }
  if (sync.busy) { sync.again = true; return; }
  sync.busy = true; setSync('busy', 'Synchronisiere …');
  try {
    // 1) neue Fotos hochladen und durch Dateipfade ersetzen
    const photos = [];
    for (const l of data.lists) for (const it of l.items) if (it.photo?.startsWith('data:')) photos.push({o:it, k:'photo', p:photoPath('',it.id)});
    for (const r of data.recipes) if (r.image?.startsWith('data:')) photos.push({o:r, k:'image', p:photoPath('r-',r.id)});
    if (photos.length) {
      const dir = await ghDir('fotos');
      for (const f of photos) {
        await ghPut(f.p, f.o[f.k].split(',')[1], dir[f.p.split('/')[1]], 'bring+: Foto');
        f.o[f.k] = f.p; touch(f.o);
      }
    }
    // 2) daten.json holen, zusammenführen, zurückschreiben (bei Konflikt nochmal)
    for (let attempt = 0; attempt < 3; attempt++) {
      const remote = await ghGet('daten.json');
      let rd = null; try { rd = remote?.text ? JSON.parse(remote.text) : null; } catch(e) {}
      const merged = rd ? mergeData(data, rd) : normalize(JSON.parse(JSON.stringify(data)));
      const changedLocal = !sameData(merged, data);
      data = merged; save({noSync:true});
      if (changedLocal) route(true);
      const text = dataText(data);
      if (rd && sameData(rd, data)) break;
      try { await ghPut('daten.json', b64utf8(text), remote?.sha, 'bring+: Listen & Rezepte'); break; }
      catch(e) { if ((e.status === 409 || e.status === 422) && attempt < 2) continue; throw e; }
    }
    // 3) Bring-Seiten der geänderten Listen
    const base = hostedBase(), dir = await ghDir('listen');
    for (const l of data.lists) {
      if (l.kind === 'pack') continue;
      const html = bringPageHtml(l, base), sha = await gitSha(html), name = l.id + '.html';
      if (sha && dir[name] === sha) continue;                       // unverändert → kein Commit
      await ghPut('listen/' + name, b64utf8(html), dir[name], 'bring+: Bring-Seite ' + l.name);
    }
    // 4) Bring-Seiten für Rezepte mit eigenen Zutaten (z. B. aus Instagram)
    const withIng = data.recipes.filter(r => r.ingredients.length);
    if (withIng.length) {
      const rdir = await ghDir('rezepte');
      for (const r of withIng) {
        const html = recipePageHtml(r, base), sha = await gitSha(html), name = r.id + '.html';
        if (sha && rdir[name] === sha) continue;
        await ghPut('rezepte/' + name, b64utf8(html), rdir[name], 'bring+: Rezept ' + r.title);
      }
    }
    local.gh.last = now(); saveLocal();
    setSync('ok', 'Synchron');
  } catch(e) {
    console.warn(e);
    setSync('err', e.status === 401 ? 'Token ungültig oder abgelaufen' : e.status === 403 ? 'Token hat keine Schreibrechte (Contents: Read and write)' :
      e.status === 404 ? 'Repository nicht gefunden' : navigator.onLine === false ? 'Offline – später erneut' : 'Fehler: ' + e.message);
    if (manual) toast(sync.msg, 4000);
  } finally {
    sync.busy = false;
    if (sync.again) { sync.again = false; setTimeout(syncNow, 300); }
  }
}

    el.ondrop = e => { e.preventDefault(); el.classList.remove('drop');
      const keys = JSON.parse(e.dataTransfer.getData('text/x-bringplus') || '[]');
      if (keys.length) transfer(keys, [el.dataset.drop], e.shiftKey ? 'move' : 'copy'); };
  });
}

/* ---------- Liste ---------- */
function viewList(l){

    <button class="iconbtn" aria-label="Symbol ändern" onclick="listMenu(${jsq(l.id)})" style="font-size:24px">${esc(l.emoji)}</button>
    <input class="title-edit" value="${esc(l.name)}" aria-label="Listenname" onchange="renameList(${jsq(l.id)}, this.value)" onkeydown="if(event.key==='Enter'||event.key==='Escape')this.blur()">
    ${syncBtn()}<button class="iconbtn" aria-label="Listen-Menü" onclick="listMenu(${jsq(l.id)})">⋯</button>`;
  const ents = effective(l), groups = byCat(ents), hidden = hiddenInherited(l);
  ui.rows = groups.flatMap(g => g.es.map(e => e.from.id + ':' + e.it.id));
  if (ui.cur && !ui.rows.includes(ui.cur)) ui.cur = null;
  for (const k of [...ui.sel]) if (!ui.rows.includes(k)) ui.sel.delete(k);
  const isBase = l.kind === 'base', isPack = l.kind === 'pack', users = usedBy(l.id), packed = packedSet(l.id);

      <span class="txt"><span class="n">${esc(it.name)}</span>${it.spec?`<br><span class="s">${esc(it.spec)}</span>`:''}</span>

        ${isPack ? `<button data-act="edit" title="Bearbeiten (Enter)" aria-label="Bearbeiten">✏️</button>` : ''}

      <button class="btn" onclick="dupList(${jsq(l.id)})" title="Liste duplizieren (D)">⧉ Duplizieren</button>

      ${g.es.map(row).join('')}</div></section>`).join('') : `<div class="empty">Noch keine Artikel.<br>Tippe auf ＋ oder drücke <span class="kbd">N</span>.</div>`}
    ${hidden.length ? `<details class="hidden-items"><summary>Ausgeblendete Baustein-Artikel (${hidden.length})</summary><div class="items">
      ${hidden.map(({it, from}) => `<div class="item inh" style="opacity:.6"><span class="dot"></span><span class="txt"><span class="n">${esc(it.name)}</span>${it.spec?` <span class="s">${esc(it.spec)}</span>`:''}</span>
        <span class="from">${esc(from.emoji)} ${esc(from.name)}</span><button class="btn small" onclick="unhide(${jsq(l.id)}, ${jsq(it.id)})">Einblenden</button></div>`).join('')}
    </div></details>` : ''}
    <div class="kbdhint"><span><span class="kbd">↑</span><span class="kbd">↓</span> bewegen</span><span><span class="kbd">Leertaste</span> auswählen</span>
      <span><span class="kbd">C</span> kopieren nach</span><span><span class="kbd">V</span> verschieben</span><span><span class="kbd">N</span> neu</span>
      <span><span class="kbd">Enter</span> bearbeiten</span><span><span class="kbd">?</span> alle Kürzel</span></div>`;
  $('#fabslot').innerHTML = `<button class="fab" aria-label="Artikel hinzufügen" onclick="editItem(${jsq(l.id)})">＋</button>`;

}
function bindRows(l){
  $$('#main .item[data-k]').forEach(el => {
    const k = el.dataset.k;
    el.onclick = e => {
      const act = e.target.closest('[data-act]')?.dataset.act;
      const [fid, iid] = k.split(':');
      if (act === 'photo') { e.stopPropagation(); const it = listById(fid).items.find(i=>i.id===iid); return viewPhoto(it.photo, itemLine(it)); }
      if (act === 'copy') return copyDialog([k], l);
      if (act === 'del') return deleteItems([k], l);
      if (act === 'hide') return hideItem(l.id, iid);
      if (act === 'edit') { ui.cur = k; return editItem(fid, iid, l.id); }
      if (l.kind === 'pack' && !act && !e.ctrlKey && !e.metaKey && !e.shiftKey && !ui.selmode) { ui.cur = k; togglePacked(l.id, k); return viewList(l); }
      if (act === 'sel' || e.ctrlKey || e.metaKey || ui.selmode) { toggleSel(k); ui.cur = k; ui.lastClick = k; return refreshRows(l); }
      if (e.shiftKey && ui.lastClick) {
        const a = ui.rows.indexOf(ui.lastClick), b = ui.rows.indexOf(k);
        ui.rows.slice(Math.min(a,b), Math.max(a,b)+1).forEach(x=>ui.sel.add(x)); ui.cur = k; return refreshRows(l);
      }
      ui.cur = k; ui.lastClick = k; editItem(fid, iid, l.id);
    };
    el.ondragstart = e => {
      const keys = ui.sel.has(k) ? [...ui.sel] : [k];
      e.dataTransfer.setData('text/x-bringplus', JSON.stringify(keys)); e.dataTransfer.effectAllowed = 'copyMove';
    };
  });
}
function refreshRows(l){
  $$('#main .item[data-k]').forEach(el => {
    const k = el.dataset.k, s = ui.sel.has(k);
    el.classList.toggle('sel', s); el.classList.toggle('cur', ui.cur === k);
    el.querySelector('.cb').textContent = s ? '✓' : '';
  });
  renderSelBar(l);
}
function toggleSel(k){ ui.sel.has(k) ? ui.sel.delete(k) : ui.sel.add(k); }
function toggleSelMode(){
  ui.selmode = !ui.selmode; document.body.classList.toggle('selmode', ui.selmode);
  if (!ui.selmode) ui.sel.clear();
  const l = currentList(); if (l) { refreshRows(l); $('#selModeBtn').textContent = ui.selmode ? '✕ Fertig' : '☑ Auswählen'; }
}
function renderSelBar(l){
  if (!ui.sel.size) { $('#selslot').innerHTML = ''; $('#fabslot').hidden = false; return; }
  $('#fabslot').hidden = true;
  $('#selslot').innerHTML = `<div class="selbar"><span class="cnt">${ui.sel.size}${isDesk() ? ' ausgewählt' : ' ✓'}</span>
    <button onclick="copyDialog([...ui.sel], currentList())">⧉ Kopieren${isDesk() ? ' nach …' : ''} <kbd>C</kbd></button>
    <button onclick="copyDialog([...ui.sel], currentList(), 'move')">➜ Verschieben <kbd>V</kbd></button>
    <button onclick="deleteItems([...ui.sel], currentList())">🗑 <kbd>Entf</kbd></button>
    ${isDesk() ? '<button onclick="ui.sel.clear();refreshRows(currentList())">✕ <kbd>Esc</kbd></button>' : ''}</div>`;
}
function currentList(){ const m = location.hash.match(/^#\/liste\/(.+)$/); return m ? listById(decodeURIComponent(m[1])) : null; }
const resolve = k => { const [fid, iid] = k.split(':'); const l = listById(fid); const it = l?.items.find(i=>i.id===iid); return it ? {l, it} : null; };

/* ---------- Kopieren / Verschieben ---------- */
function copyDialog(keys, fromList, mode = 'copy'){
  keys = keys.filter(resolve); if (!keys.length) return;
  const targets = data.lists.filter(t => t.id !== fromList?.id);
  const picked = new Set(local.lastTargets?.filter(id => targets.some(t=>t.id===id)) || []);
  const names = keys.map(k => resolve(k).it.name);
  openSheet(`<h2>${keys.length === 1 ? '„'+esc(names[0])+'“' : keys.length + ' Artikel'} ${mode==='move'?'verschieben':'kopieren'} nach …</h2>
    <div class="menu" id="cdList">${targets.map((t,i) => {
      const has = keys.filter(k => effective(t).some(e => itemKey(e.it) === itemKey(resolve(k).it))).length;
      return `<label><input type="checkbox" value="${esc(t.id)}" ${picked.has(t.id)?'checked':''}>
        <span style="font-size:20px">${esc(t.emoji)}</span><span class="grow">${esc(t.name)}${t.kind==='base'?' <small style="display:inline">· Baustein</small>':''}
        ${has ? `<small>${has === keys.length ? 'schon vorhanden' : has + ' schon vorhanden'}</small>` : ''}</span>${i<9?`<span class="kbd">${i+1}</span>`:''}</label>`; }).join('')}</div>
    <p class="muted" style="margin-top:-6px">Tipp: Gemeinsame Artikel in einen <b>Baustein</b> verschieben – dann stehen sie automatisch in allen Listen, die ihn einbinden.</p>
    <div class="row"><button class="btn grow" id="cdMove">➜ Verschieben <kbd>⇧ Enter</kbd></button>
      <button class="btn primary grow" id="cdCopy">⧉ Kopieren <kbd>Enter</kbd></button></div>`,
  () => {
    const sel = () => $$('#cdList input:checked').map(x=>x.value);
    const go = m => { const t = sel(); if (!t.length) return toast('Bitte mindestens eine Liste wählen'); local.lastTargets = t; saveLocal(); closeSheet(); transfer(keys, t, m); };
    $('#cdCopy').onclick = () => go('copy'); $('#cdMove').onclick = () => go('move');
    if (mode === 'move') { $('#cdMove').classList.add('primary'); $('#cdCopy').classList.remove('primary'); }
    $('#sheet').onkeydown = e => {
      if (/^[1-9]$/.test(e.key)) { const cb = $$('#cdList input')[+e.key-1]; if (cb) { cb.checked = !cb.checked; e.preventDefault(); } }
      else if (e.key === 'Enter') { e.preventDefault(); go(e.shiftKey || (mode==='move' && !e.ctrlKey) ? 'move' : 'copy'); }
    };
    ($$('#cdList input')[0] || $('#cdCopy')).focus({preventScroll:true});
  });
}
function transfer(keys, targetIds, mode){
  const src = keys.map(resolve).filter(Boolean);
  let added = 0, skipped = 0;
  for (const tid of targetIds) {
    const t = listById(tid); if (!t) continue;
    for (const {l, it} of src) {
      if (l.id === t.id) { if (mode === 'copy') skipped++; continue; }
      if (effective(t).some(e => itemKey(e.it) === itemKey(it))) { skipped++; continue; }
      t.items.push({id:uid(), name:it.name, spec:it.spec, cat:it.cat, ...(it.photo?{photo:it.photo}:{}), u:now()}); added++;
    }
  }
  if (mode === 'move') for (const {l, it} of src) if (!targetIds.includes(l.id)) { l.items = l.items.filter(x=>x!==it); tomb('item', it.id); }
  ui.sel.clear(); save();
  const tn = targetIds.length === 1 ? '„' + listById(targetIds[0]).name + '“' : targetIds.length + ' Listen';
  toast((mode==='move' ? `${src.length} Artikel nach ${tn} verschoben` : `${added} × nach ${tn} kopiert`) + (skipped ? ` · ${skipped} schon vorhanden` : ''));
  route();
}
function deleteItems(keys, l){
  const src = keys.map(resolve).filter(Boolean); if (!src.length) return;
  const inh = src.filter(s => s.l.id !== l.id);
  const msg = src.length === 1 ? `„${src[0].it.name}“ löschen?` : `${src.length} Artikel löschen?`;
  if (!confirm(msg + (inh.length ? `\n\n${inh.length} davon stammen aus einem Baustein und verschwinden damit aus allen Listen, die ihn nutzen. (Nur hier ausblenden: 👁)` : ''))) return;
  for (const {l:sl, it} of src) { sl.items = sl.items.filter(x=>x!==it); tomb('item', it.id); }
  ui.sel.clear(); save(); route(); toast(src.length === 1 ? `„${src[0].it.name}“ gelöscht` : `${src.length} Artikel gelöscht`);
}
function hideItem(lid, iid){ const l = listById(lid); if (!l.excludes.includes(iid)) l.excludes.push(iid); touch(l); save(); route(); toast('In dieser Liste ausgeblendet'); }
function unhide(lid, iid){ const l = listById(lid); l.excludes = l.excludes.filter(x=>x!==iid); touch(l); save(); route(); }

/* ---------- Listen-Aktionen ---------- */
function newList(kind = 'list'){
  openSheet(`<h2>${kind==='base'?'Neuer Baustein':kind==='pack'?'Neue Packliste':'Neue Liste'}</h2>
    <div class="field"><label>Name</label><input id="nlName" placeholder="${kind==='base'?'z. B. Frühstück Basis':kind==='pack'?'z. B. Skiurlaub packen':'z. B. Grillabend'}"></div>

      <button type="button" data-v="list" class="${kind==='list'?'on':''}">🛒 Einkaufsliste</button>
      <button type="button" data-v="pack" class="${kind==='pack'?'on':''}">🧳 Packliste</button>
      <button type="button" data-v="base" class="${kind==='base'?'on':''}">🧩 Baustein</button></div></div>
    <div class="field"><label>Symbol</label><div class="chips" id="nlEmo">${EMOJIS.map((e,i)=>`<button type="button" class="${(kind==='base'?e==='🧺':kind==='pack'?e==='🧳':i===0)?'on':''}">${e}</button>`).join('')}</div></div>
    <div class="field"><label>Artikel übernehmen aus</label><select id="nlFrom"><option value="">– leer starten –</option>
      ${data.lists.map(l=>`<option value="${esc(l.id)}">${esc(l.emoji)} ${esc(l.name)}</option>`).join('')}</select></div>
    ${baseLists().length ? `<div class="field"><label>Bausteine einbinden</label><div class="chips txt" id="nlInc">${baseLists().map(b=>`<button type="button" data-v="${esc(b.id)}">${esc(b.emoji)} ${esc(b.name)}</button>`).join('')}</div></div>` : ''}
    <div class="row"><button class="btn grow" onclick="closeSheet()">Abbrechen</button><button class="btn primary grow" id="nlOk">Anlegen</button></div>`,
  () => {
    let emo = kind==='base' ? '🧺' : kind==='pack' ? '🧳' : EMOJIS[0];
    const chipToggle = (sel, single) => $(sel) && ($(sel).onclick = e => { const b = e.target.closest('button'); if (!b) return;
      if (single) [...$(sel).children].forEach(x=>x.classList.toggle('on', x===b)); else b.classList.toggle('on'); });
    chipToggle('#nlKind', true); chipToggle('#nlInc', false);
    $('#nlEmo').onclick = e => { const b = e.target.closest('button'); if (!b) return; emo = b.textContent; [...$('#nlEmo').children].forEach(x=>x.classList.toggle('on', x===b)); };
    $('#nlName').focus();
    $('#nlName').onkeydown = e => { if (e.key === 'Enter') $('#nlOk').click(); };
    $('#nlOk').onclick = () => {
      const name = $('#nlName').value.trim(); if (!name) return $('#nlName').focus();
      let id = slug(name); while (listById(id)) id = slug(name) + '-' + uid().slice(0,3);
      const src = listById($('#nlFrom').value);
      data.lists.push({id, name, emoji: emo, kind: $('#nlKind .on').dataset.v, u: now(),
        includes: $$('#nlInc .on').map(b=>b.dataset.v), excludes: [],
        items: src ? src.items.map(i=>({...i, id:uid(), u:now()})) : []});
      data.listOrderU = now(); save(); closeSheet(); location.hash = '#/liste/' + encodeURIComponent(id);
    };
  });
}
function renameList(id, name){ const l = listById(id); if (l && name.trim() && name.trim() !== l.name) { l.name = name.trim(); touch(l); save(); renderSide(); } }

function includeMenu(id){

function effectiveIncludes(l, s = new Set()){ for (const i of l.includes) if (!s.has(i)) { s.add(i); const b = listById(i); if (b) effectiveIncludes(b, s); } return s; }

      <option value="${esc(viewL.id)}">${esc(viewL.emoji)} ${esc(viewL.name)} (nur diese Liste)</option>
      ${[...effectiveIncludes(viewL)].map(listById).filter(Boolean).map(b=>`<option value="${esc(b.id)}">${esc(b.emoji)} ${esc(b.name)} (Baustein – alle Listen)</option>`).join('')}</select></div>` : ''}

      <button class="btn primary grow" id="iOk">Speichern</button></div>`,
  () => {
    if (!it || isDesk()) { const n = $('#iName'); n.focus(); if (it) n.select(); }
    let photo = it?.photo || '';
    const showPhoto = () => {
      $('#iPhotoBox').innerHTML = photo ? `<img src="${esc(photo)}" alt="Vorschau" onclick="viewPhoto(this.src)">` : '';
      $('#iNoPhoto').hidden = !photo; $('#iPick').textContent = photo ? '📷 Anderes Foto' : '📷 Foto aufnehmen / wählen';
    };
    showPhoto();
    $('#iPick').onclick = () => $('#iFile').click();
    $('#iNoPhoto').onclick = () => { photo = ''; showPhoto(); };
    $('#iFile').onchange = async e => { const f = e.target.files[0]; if (!f) return;
      $('#iPick').textContent = '⏳ Foto wird verkleinert …';
      try { photo = await shrinkPhoto(f); } catch(err) { toast(err.message); } showPhoto(); };
    const commit = () => {
      const name = $('#iName').value.trim(); if (!name) { $('#iName').focus(); return false; }
      const vals = {name, spec: $('#iSpec').value.trim(), cat: $('#iCat').value};
      local.lastCat = vals.cat; saveLocal();

      if (!it && effective(viewL || tl).some(e => itemKey(e.it) === itemKey(vals))) { toast(`„${itemLine(vals)}“ steht schon auf der Liste`); return false; }
      let target = it; if (!target) { target = {id:uid()}; tl.items.push(target); }
      const before = {...target};
      Object.assign(target, vals); if (photo) target.photo = photo; else delete target.photo; touch(target);
      if (!save()) { if (it) { Object.keys(target).forEach(k=>delete target[k]); Object.assign(target, before); } else tl.items = tl.items.filter(x=>x!==target); return false; }
      if (viewL) { ui.cur = (tl.id) + ':' + target.id; viewList(viewL); }

  });

function showKeys(){
  const K = (k, t) => `<span>${k.split(' ').map(x=>`<span class="kbd">${x}</span>`).join(' ')}</span><span>${t}</span>`;
  openSheet(`<h2>⌨️ Tastenkürzel</h2>
    <div class="sec" style="margin-top:0">Überall</div>
    <div class="keys">${K('1 … 9','Liste öffnen (Reihenfolge wie links)')}${K('R','Rezeptbuch')}${K('H','Übersicht')}${K('S','Jetzt synchronisieren')}${K('?','Diese Hilfe')}${K('Esc','Dialog schließen / Auswahl aufheben')}</div>
    <div class="sec">In einer Liste</div>
    <div class="keys">${K('↑ ↓','Artikel wählen (auch J / K)')}${K('Leertaste','Artikel markieren')}${K('⇧ ↑ ↓','Mehrere markieren')}${K('A','Alle markieren')}
      ${K('C','Kopieren nach … (markierte oder aktueller Artikel)')}${K('V','Verschieben nach …')}${K('Enter','Bearbeiten')}${K('N','Neuer Artikel')}
      ${K('Entf','Löschen')}${K('D','Liste duplizieren')}${K('B','In Bring importieren')}${K('P','Packliste: abhaken')}</div>
    <div class="sec">Im Kopieren-Dialog</div>
    <div class="keys">${K('1 … 9','Zielliste an/aus')}${K('Enter','Kopieren')}${K('⇧ Enter','Verschieben')}</div>
    <p class="muted">Mit der Maus: Strg/⌘ + Klick markiert, ⇧ + Klick markiert einen Bereich. Artikel lassen sich auf eine Liste in der Seitenleiste ziehen (mit ⇧ = verschieben).</p>
    <button class="btn primary" style="width:100%;justify-content:center" onclick="closeSheet()">OK</button>`);
}
document.addEventListener('keydown', e => {
  const tag = (e.target.tagName||'').toLowerCase();
  const typing = ['input','textarea','select'].includes(tag) && e.target.type !== 'checkbox';
  if (e.key === 'Escape') {
    if ($('#viewer').classList.contains('on')) return $('#viewer').classList.remove('on');
    if (sheetOpen()) return closeSheet();
    if (typing) return e.target.blur();
    if (ui.sel.size) { ui.sel.clear(); const l = currentList(); if (l) refreshRows(l); }
    return;
  }
  if (typing || sheetOpen() || e.altKey || ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() !== 'a')) return;
  const k = e.key, l = currentList();
  const ordered = orderedLists();
  if (/^[1-9]$/.test(k) && ordered[+k-1]) { location.hash = '#/liste/' + encodeURIComponent(ordered[+k-1].id); return; }
  if (k === '?') { e.preventDefault(); return showKeys(); }
  if (k === 'r' || k === 'R') { location.hash = '#/rezepte'; return; }
  if (k === 'h' || k === 'H') { location.hash = ''; return; }
  if (k === 's' || k === 'S') { syncNow(true); return; }
  if (location.hash.startsWith('#/rezepte')) {
    if (k === '/') { e.preventDefault(); $('#rq')?.focus(); }
    if (k === 'n' || k === 'N') { e.preventDefault(); editRecipe(); }
    return;
  }
  if (!l) return;
  const rows = ui.rows, i = rows.indexOf(ui.cur);
  const move = d => { e.preventDefault();
    const ni = i < 0 ? (d > 0 ? 0 : rows.length-1) : Math.max(0, Math.min(rows.length-1, i + d));
    if (e.shiftKey) { if (ui.cur) ui.sel.add(ui.cur); ui.sel.add(rows[ni]); }
    ui.cur = rows[ni]; refreshRows(l);
    document.querySelector(`.item[data-k="${CSS.escape(ui.cur)}"]`)?.scrollIntoView({block:'nearest'}); };
  const targetKeys = () => ui.sel.size ? [...ui.sel] : (ui.cur ? [ui.cur] : []);
  switch (k) {
    case 'ArrowDown': case 'j': case 'J': return move(1);
    case 'ArrowUp': case 'k': case 'K': return move(-1);
    case ' ': e.preventDefault(); if (ui.cur) { toggleSel(ui.cur); refreshRows(l); } return;
    case 'a': case 'A': e.preventDefault(); rows.forEach(r=>ui.sel.add(r)); return refreshRows(l);
    case 'c': case 'C': if (targetKeys().length) copyDialog(targetKeys(), l); else toast('Erst einen Artikel wählen (↑ ↓)'); return;
    case 'v': case 'V': case 'm': case 'M': if (targetKeys().length) copyDialog(targetKeys(), l, 'move'); return;
    case 'Enter': if (ui.cur) { const [fid, iid] = ui.cur.split(':'); editItem(fid, iid, l.id); } return;
    case 'n': case 'N': case '+': e.preventDefault(); return editItem(l.id);
    case 'Delete': case 'Backspace': if (targetKeys().length) { e.preventDefault(); deleteItems(targetKeys(), l); } return;
    case 'd': case 'D': return dupList(l.id);
    case 'b': case 'B': return l.kind === 'pack' ? null : openInBring(l);
    case 'p': case 'P': if (l.kind === 'pack' && ui.cur) { togglePacked(l.id, ui.cur); viewList(l); } return;
  }
});

function toggleRF(k){ local.rf[k] = !local.rf[k]; saveLocal(); viewRecipes(); }
function filteredRecipes(){
  const f = local.rf, q = keyOf(f.q);
  const seasons = SEASONS.filter(s => f['s_'+s.id]).map(s=>s.id);
  let rs = data.recipes.filter(r =>
    (!q || keyOf(r.title + ' ' + r.desc + ' ' + r.source + ' ' + r.note + ' ' + r.ingredients.join(' ')).includes(q)) &&
    (!f.vegan || r.vegan) && (!f.veggie || r.veggie || r.vegan) && (!f.kids || r.kids) &&
    (!f.quick || (r.time && r.time <= 30)) && (!f.top || avgRating(r) >= 4) && (!f.new || !r.cooked) &&
    (!seasons.length || !r.seasons.length || r.seasons.some(s => seasons.includes(s))) &&
    (!f.course || r.course === f.course));
  const s = f.sort || 'rating';
  rs.sort((a,b) => s==='az' ? a.title.localeCompare(b.title,'de') : s==='new' ? b.added - a.added : s==='cooked' ? b.cooked - a.cooked :
    s==='time' ? (a.time||999) - (b.time||999) : (avgRating(b) - avgRating(a)) || b.added - a.added);
